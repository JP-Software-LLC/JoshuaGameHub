<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Rush · Joshua Game Hub</title>
<meta name="theme-color" content="#ffd166">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b2f45; --ink2:#666c88; --sun:#ffd166; --sun2:#e0a92b; --paper:#fffaf0; --line:#efe3c6; --pink:#ef476f; --pink2:#b22a4e; --teal:#118ab2; --teal2:#0a5e7a;
    --f:"Fredoka",system-ui,sans-serif; --lf:"Lexend","Fredoka",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sun);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  body{background:radial-gradient(circle at 20% 10%,#ffe29a,transparent 50%),radial-gradient(circle at 90% 90%,#ffb84d55,transparent 50%),var(--sun)}
  button,input{font-family:inherit}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;z-index:5}
  .screen.on{display:flex}
  .card{width:100%;max-width:560px;background:var(--paper);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;
    box-shadow:0 8px 0 rgba(43,47,69,.18),0 30px 70px -20px rgba(43,47,69,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
  .logo{margin:0;text-align:center;font-weight:700;font-size:60px;line-height:1;color:var(--pink);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 5px 0 var(--pink2)}
  .logo span{color:var(--teal);text-shadow:0 5px 0 var(--teal2)}
  .logo small{display:block;font-size:.25em;font-weight:700;letter-spacing:5px;color:var(--ink2);-webkit-text-stroke:0;text-shadow:none;margin-top:10px}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .how div{background:#fdf0cf;border-radius:16px;padding:10px;text-align:center;font-size:15px;color:var(--ink2);line-height:1.25;font-weight:600}
  .how b{display:block;font-size:26px;margin-bottom:2px}
  .lbl{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2)}
  input.f{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 16px;font-size:19px;font-weight:600;color:var(--ink);outline:none;background:#fff}
  input.f:focus{border-color:var(--teal)}
  .btn{appearance:none;border:0;border-radius:16px;padding:14px 18px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink2);transition:transform .08s,box-shadow .08s,filter .15s}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2)}
  .btn.blue{background:var(--teal);box-shadow:0 5px 0 var(--teal2)}
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
  .err{min-height:1.2em;margin:0;color:var(--pink);text-align:center;font-weight:700}
  .code{font-size:54px;font-weight:700;letter-spacing:10px;text-align:center;line-height:1}
  .count{text-align:center;color:var(--ink2);font-weight:600}
  .grid{display:flex;flex-wrap:wrap;gap:7px;max-height:36vh;overflow:auto}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;background:#fdf0cf;font-weight:600;font-size:15px}
  .chip i,.sw{min-width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;font-style:normal;font-size:11px;color:#fff;font-weight:700;padding:0 4px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
  .chip.me{box-shadow:inset 0 0 0 3px var(--teal)}
  .chip.away{opacity:.45}
  .note{text-align:center;color:var(--ink2);margin:0;font-weight:600}

  /* ---- game ---- */
  #game{position:fixed;inset:0;display:none;z-index:2}
  #game.on{display:block}
  #cv{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:crosshair}
  #side{position:absolute;top:10px;right:10px;bottom:10px;width:300px;background:var(--paper);border-radius:20px;box-shadow:0 6px 0 rgba(43,47,69,.15);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  #side .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-right:34px}
  #theme{font-weight:700;font-size:22px;line-height:1.05}
  #theme small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--ink2)}
  #clock{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;background:#fdf0cf;border-radius:12px;padding:3px 10px}
  #clock.low{background:var(--pink);color:#fff}
  #me{display:flex;align-items:center;gap:10px;background:#fdf0cf;border-radius:14px;padding:8px 10px;font-weight:700}
  #me .sw{width:30px;height:30px;font-size:13px}
  #me b{margin-left:auto;font-size:22px}
  #lead{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:15px}
  #lead .r{display:flex;align-items:center;gap:7px} #lead .r b{margin-left:auto}
  #lead .t{font-size:11px;letter-spacing:1.5px;color:var(--ink2);font-weight:700}
  #bank{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;align-content:start;font-family:var(--lf)}
  #bank .w{font-size:16px;font-weight:700;letter-spacing:1px;padding:3px 6px;border-radius:8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bank .w.got{color:#fff;text-decoration:line-through;text-decoration-thickness:2px}
  #bank .w.new{animation:bump .6s}
  @keyframes bump{30%{transform:scale(1.15)}}
  #bank .w small{display:block;font-size:10px;font-family:var(--f);letter-spacing:.5px;text-decoration:none;opacity:.9;font-weight:600}
  #left{font-size:13px;color:var(--ink2);font-weight:700;text-align:center}
  /* teacher room, student screen: no bank (it's on the big screen), slim strip on top, board gets the room */
  #strip{position:absolute;left:10px;right:54px;top:8px;height:44px;display:none;align-items:center;gap:14px;background:var(--paper);border-radius:14px;padding:0 14px;box-shadow:0 4px 0 rgba(43,47,69,.15);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden}
  #strip .sw{width:26px;height:26px}
  #strip .sp{color:var(--ink2);font-weight:600;font-size:14px}
  body.slim #side{display:none} body.slim #strip{display:flex}
  /* teacher's big screen: wider bank with bigger words */
  body.big #side{width:min(440px,34vw)}
  body.big #bank .w{font-size:21px} body.big #theme{font-size:28px}
  #msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:700;font-size:min(16vw,110px);color:#fff;-webkit-text-stroke:5px var(--pink2);paint-order:stroke fill;opacity:0;white-space:nowrap;pointer-events:none;z-index:4}
  #msg.show{animation:msg 1.1s ease-out forwards}
  @keyframes msg{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
  #toast{display:flex;flex-direction:column;gap:5px;pointer-events:none;min-height:0}
  #toast:empty{display:none}
  #toast div{background:rgba(43,47,69,.88);color:#fff;font-weight:600;padding:5px 12px;border-radius:12px;font-size:14px;animation:tin 3s forwards}
  @keyframes tin{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

  #results .card{max-width:600px;text-align:center}
  .champ{display:flex;flex-direction:column;align-items:center;gap:2px}
  .champ .t{font-weight:700;letter-spacing:3px;color:var(--pink);text-transform:uppercase;font-size:14px}
  .champ h2{margin:0;font-size:40px;line-height:1.1}
  .board{display:flex;flex-direction:column;gap:7px;text-align:left}
  .line{display:grid;grid-template-columns:36px 30px 1fr auto auto;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;background:#fdf0cf;font-weight:600;animation:pop .4s cubic-bezier(.2,1.4,.4,1) backwards}
  .line .pos{font-size:20px;font-weight:700;color:var(--ink2)}
  .line .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .cl{color:var(--ink2);font-size:14px}
  .line .tm{font-size:20px;font-weight:700;min-width:44px;text-align:right}
  .line.p1{background:#fff2c4;box-shadow:inset 0 0 0 3px var(--sun2)}
  .line.me{box-shadow:inset 0 0 0 3px var(--teal)}
  .you{display:flex;justify-content:space-between;font-weight:600;color:var(--ink2);padding:0 6px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
  #exitBtn{position:fixed;top:12px;right:12px;z-index:9;width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;border:0;color:var(--ink2);cursor:pointer}
  @media (max-width:620px){ .logo{font-size:44px} .how{grid-template-columns:1fr} .card{padding:20px} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="/assets/hub-frame.js" defer></script>
</head>
<body>
<button id="exitBtn" type="button" title="Back to game hub" aria-label="Back to game hub"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

<div id="game">
  <canvas id="cv"></canvas>
  <aside id="side">
    <div class="top"><div id="theme"><small>THEME</small>—</div><div id="clock">6:00</div></div>
    <div id="me"><span class="sw" id="meSw"></span><span id="meName">You</span><b id="mePts">0</b></div>
    <div id="lead"></div>
    <div class="lbl">Word bank</div>
    <div id="bank"></div>
    <div id="toast"></div>
    <div id="left"></div>
  </aside>
  <div id="strip"><span class="sw" id="stSw"></span><span id="stName"></span><span>⭐ <span id="stPts">0</span></span><span class="sp" id="stWords"></span><span class="sp" id="stLead" style="overflow:hidden;text-overflow:ellipsis"></span><span id="stClock" style="margin-left:auto">6:00</span></div>
</div>
<div id="msg"></div>

<!-- MENU -->
<section class="screen on" id="menu"><div class="card">
  <h1 class="logo">WORD <span>RUSH</span><small>ONE GIANT WORD SEARCH · FIRST ONE WINS IT</small></h1>
  <div class="how">
    <div><b>🔎</b>Everyone gets the same giant puzzle</div>
    <div><b>🖱️</b>Drag across a word, any direction, even backwards</div>
    <div><b>⚡</b>First to find a word claims it in your colour</div>
  </div>
  <div><div class="lbl" style="margin-bottom:6px">Your name</div><input class="f" id="nameIn" maxlength="14" placeholder="Type a name" autocomplete="off"></div>
  <div class="row"><button class="btn" id="bPublic">Play online</button><button class="btn blue" id="bPrivate">Private party</button></div>
  <div class="row"><input class="f" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center"><button class="btn alt" id="bJoin" style="flex:0 0 auto">Join</button></div>
  <button class="btn alt" id="bTeacher">🍎 Teacher mode · run a game for your class</button>
  <button class="btn alt" id="bSolo">Solo vs bots</button>
  <p class="err" id="err"></p>
</div></section>

<!-- LOBBY -->
<section class="screen" id="lobby"><div class="card">
  <div class="lbl" id="lKind" style="text-align:center">Private party</div>
  <div class="code" id="lCode">----</div>
  <div class="count" id="lCount">1 / 40 players</div>
  <div class="grid" id="lGrid"></div>
  <p class="note" id="lNote"></p>
  <div class="row"><button class="btn" id="bStart">Start!</button><button class="btn alt" id="bLeave" style="flex:0 0 auto">Leave</button></div>
</div></section>

<!-- RESULTS -->
<section class="screen" id="results"><div class="card">
  <div class="champ" id="champ"></div>
  <div class="board" id="rBoard"></div>
  <div class="you" id="rYou"></div>
  <div class="row"><button class="btn" id="bAgain">Back to lobby</button><a class="btn alt" href="../" style="text-align:center;text-decoration:none;flex:0 0 auto">Game hub</a></div>
</div></section>
<canvas id="confetti"></canvas>

<script src="../config.js" onerror="window.CG_CONFIG={server:''}"></script>
<script src="../assets/classkit.js"></script>
<script src="../wordsearch.js"></script>
<script>
"use strict";
const DEMO=/[?&]demo=1/.test(location.search);      // hub live preview: bots only, no input
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={ get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };
const { T }=WORDS;
const GAME="words";
const pcol=i=>WORDS.color(i), pink=i=>WORDS.ink(i);
const CONF=["#ef476f","#118ab2","#06d6a0","#ffd166","#8338ec","#fb5607"];

// ============================================================
//  STATE
// ============================================================
const G={ mode:"", me:0, teacherView:false, teacherRoom:false, players:new Map(), board:null, found:[], scores:new Map(), endAt:0, startAt:0, local:null, resultShown:false, drag:null, misses:[], hover:null };
let screen="menu";
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); screen=id;
  $("game").classList.toggle("on",id==="game");
  const t=id==="menu"?"Back to game hub":"Leave game"; $("exitBtn").title=t; $("exitBtn").setAttribute("aria-label",t);
  if (id==="game") layout();
}
const err=t=>$("err").textContent=t||"";
$("nameIn").value=store.get("cg_name")||"";
const myName=()=>{ const n=$("nameIn").value.trim().slice(0,14)||"Player"; store.set("cg_name",n); return n; };
function flash(t){ const m=$("msg"); m.textContent=t; m.classList.remove("show"); void m.offsetWidth; m.classList.add("show"); }
function toast(html){ if (document.body.classList.contains("slim")) return; const d=document.createElement("div"); d.innerHTML=html; $("toast").appendChild(d); setTimeout(()=>d.remove(),3000); while ($("toast").children.length>3) $("toast").firstChild.remove(); }
const nameOf=pid=>G.players.get(pid)?.name||"Someone";
const colOf=pid=>pcol(G.players.get(pid)?.color??0), inkOf=pid=>pink(G.players.get(pid)?.color??0);

// ============================================================
//  LAYOUT + DRAWING
// ============================================================
const cv=$("cv"), cx=cv.getContext("2d");
let DPR=1, CS=30, BX=0, BY=0, AW=0, AH=0;
function layout(){
  const B=G.board; if (!B) return;
  const slim=document.body.classList.contains("slim");
  const side=slim?0:$("side").offsetWidth+20, top=slim?60:10;
  AW=innerWidth-side; AH=innerHeight;
  DPR=Math.min(2,devicePixelRatio||1); cv.width=AW*DPR; cv.height=AH*DPR; cv.style.width=AW+"px"; cv.style.height=AH+"px"; cx.setTransform(DPR,0,0,DPR,0,0);
  CS=Math.floor(Math.min((AW-24)/B.cols,(AH-top-14)/B.rows));
  BX=Math.round((AW-CS*B.cols)/2); BY=Math.round(top+(AH-top-CS*B.rows)/2);
}
addEventListener("resize",layout);
const cc=(r,c)=>[BX+c*CS+CS/2, BY+r*CS+CS/2];
function capsule(a,fill,stroke,alpha,grow=0){
  const [x0,y0]=cc(a[0],a[1]), [x1,y1]=cc(a[2],a[3]);
  cx.save(); cx.globalAlpha=alpha; cx.lineCap="round";
  if (stroke){ cx.strokeStyle=stroke; cx.lineWidth=CS*0.86+grow+4; cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.stroke(); }
  cx.strokeStyle=fill; cx.lineWidth=CS*0.86+grow; cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.stroke();
  cx.restore();
}
function draw(now){
  const B=G.board; cx.clearRect(0,0,AW,AH); if (!B) return;
  // paper
  cx.fillStyle="rgba(0,0,0,.12)"; roundRect(BX-10,BY-6,CS*B.cols+20,CS*B.rows+20,18); cx.fill();
  cx.fillStyle="#fffaf0"; roundRect(BX-10,BY-10,CS*B.cols+20,CS*B.rows+20,18); cx.fill();
  // found words, in the finder's colour (fresh ones pulse)
  for (const f of G.found) if (f){ const age=(now-f.at)/1000, pulse=age<0.8?Math.sin(age/0.8*Math.PI)*CS*0.35:0;
    capsule(f.a,colOf(f.pid),null,f.pid===G.me?0.62:0.5,pulse); }
  // misses fade out red
  G.misses=G.misses.filter(m=>now-m.at<600); for (const m of G.misses) capsule(m.a,"#ef476f",null,0.45*(1-(now-m.at)/600));
  // my drag
  if (G.drag && G.drag.a) capsule(G.drag.a,colOf(G.me),"#fff",0.55);
  else if (G.hover && !G.teacherView){ const [x,y]=cc(G.hover[0],G.hover[1]); cx.fillStyle="rgba(17,138,178,.14)"; cx.beginPath(); cx.arc(x,y,CS*0.45,0,7); cx.fill(); }
  // letters
  cx.font=`700 ${Math.round(CS*0.6)}px Lexend, Fredoka, sans-serif`; cx.textAlign="center"; cx.textBaseline="middle";
  const lit=new Map(); for (const f of G.found) if (f){ const k=inkOf(f.pid)==="#fff"?"#fff":"#1d2033"; for (const i of WORDS.lineCells(f.a,B.cols,B.rows)||[]) lit.set(i,k); }
  for (let r=0;r<B.rows;r++) for (let c=0;c<B.cols;c++){ const i=r*B.cols+c, [x,y]=cc(r,c);
    cx.fillStyle=lit.has(i)?lit.get(i):"#2b2f45"; cx.fillText(B.grid[i],x,y+CS*0.03); }
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

// ============================================================
//  INPUT — press on a letter, drag (snaps to the 8 directions), let go
// ============================================================
function cellAt(e){ const r=cv.getBoundingClientRect(), x=e.clientX-r.left-BX, y=e.clientY-r.top-BY; return [Math.floor(y/CS),Math.floor(x/CS)]; }
const inB=(r,c)=>G.board&&r>=0&&c>=0&&r<G.board.rows&&c<G.board.cols;
function canPlay(){ return screen==="game" && !G.teacherView && !DEMO && performance.now()>=G.startAt && G.board && !G.resultShown; }
cv.addEventListener("pointerdown",e=>{
  if (!canPlay()) return; const [r,c]=cellAt(e); if (!inB(r,c)) return;
  try{ cv.setPointerCapture(e.pointerId); }catch{} G.drag={ r,c, a:[r,c,r,c] }; e.preventDefault();
});
cv.addEventListener("pointermove",e=>{
  const [r,c]=cellAt(e); G.hover=inB(r,c)?[r,c]:null;
  const d=G.drag; if (!d) return;
  const r2=cv.getBoundingClientRect(), px=(e.clientX-r2.left-BX)/CS-0.5-d.c, py=(e.clientY-r2.top-BY)/CS-0.5-d.r;
  const len=Math.hypot(px,py); if (len<0.5){ d.a=[d.r,d.c,d.r,d.c]; return; }
  const k=Math.round(Math.atan2(py,px)/(Math.PI/4)), dc=Math.round(Math.cos(k*Math.PI/4)), dr=Math.round(Math.sin(k*Math.PI/4));
  let n=Math.round(dr&&dc?len/Math.SQRT2:len);
  while (n>0 && !inB(d.r+dr*n,d.c+dc*n)) n--;
  d.a=[d.r,d.c,d.r+dr*n,d.c+dc*n];
});
cv.addEventListener("pointerleave",()=>{ G.hover=null; });
const endDrag=()=>{
  const d=G.drag; G.drag=null; if (!d || !canPlay()) return;
  const a=d.a; if (a[0]===a[2]&&a[1]===a[3]) return;
  const i=WORDS.match(G.board,G.found,a);
  if (i<0){
    const s=WORDS.readLine(G.board,a), rev=[...s].reverse().join(""), j=G.board.words.findIndex(w=>w.w===s||w.w===rev);
    G.misses.push({ a, at:performance.now() });
    if (j>=0 && G.found[j]) toast(`${esc(G.board.words[j].w)} was already found by ${esc(nameOf(G.found[j].pid))}`);
    return;
  }
  if (G.mode==="solo"){ G.local.claim(G.me,a); soloEvents(); }
  else { Net.send({ t:"claim", a }); G.pending={ a, at:performance.now() }; }
};
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",()=>{ G.drag=null; });

// ============================================================
//  SIDE PANEL / STRIP
// ============================================================
function renderBank(newI=-1){
  const B=G.board; if (!B) return;
  $("theme").innerHTML=`<small>THEME</small>${esc(B.theme)}`;
  $("bank").innerHTML=B.words.map((w,i)=>{ const f=G.found[i];
    return f?`<div class="w got ${i===newI?"new":""}" style="background:${colOf(f.pid)};color:${inkOf(f.pid)}">${esc(w)}<small>${esc(nameOf(f.pid))}</small></div>`:`<div class="w">${esc(w)}</div>`; }).join("");
  const left=G.found.filter(f=>!f).length;
  $("left").textContent=`${left} of ${B.words.length} words left`;
  $("stWords").textContent=`${left} of ${B.words.length} words left`;
  renderScores();
}
function renderScores(){
  const me=G.scores.get(G.me)||{ pts:0, n:0 };
  $("mePts").textContent=me.pts; $("stPts").textContent=me.pts;
  const p=G.players.get(G.me);
  for (const [sw,nm] of [["meSw","meName"],["stSw","stName"]]){ $(sw).style.background=p?pcol(p.color):"#999"; $(sw).style.color=p?pink(p.color):"#fff"; $(sw).style.textShadow="none"; $(sw).textContent=p?p.color+1:""; $(nm).textContent=p?`${p.name} · ${me.n} found`:"Watching"; }
  $("me").style.display=G.teacherView?"none":"";
  const top=[...G.scores.entries()].filter(([,s])=>s.pts>0).sort((a,b)=>b[1].pts-a[1].pts).slice(0,3);
  $("lead").innerHTML=`<div class="t">TOP FINDERS</div>`+(top.length?top.map(([pid,s],i)=>`<div class="r">${["🥇","🥈","🥉"][i]} <span class="sw" style="background:${colOf(pid)};color:${inkOf(pid)};text-shadow:none">${(G.players.get(pid)?.color??0)+1}</span>${esc(nameOf(pid))}<b>${s.pts}</b></div>`).join(""):`<div class="r" style="color:var(--ink2)">Nobody yet. Go!</div>`);
  $("stLead").textContent=top.length?"🥇 "+nameOf(top[0][0])+" "+top[0][1].pts:"";
}
function onFound(i,pid,a,pts){
  if (G.found[i]) return;
  G.found[i]={ pid, a, at:performance.now() };
  const s=G.scores.get(pid)||{ pts:0, n:0 }; s.pts+=pts; s.n++; G.scores.set(pid,s);
  const w=G.board.words[i];
  if (pid===G.me) flash(`+${pts}`);
  else if (!DEMO) toast(`<span class="sw" style="background:${colOf(pid)};color:${inkOf(pid)};text-shadow:none">${(G.players.get(pid)?.color??0)+1}</span> ${esc(nameOf(pid))} found <b>${esc(w)}</b>`);
  renderBank(i);
}
function clock(now){
  const s=Math.max(0,Math.ceil((G.endAt-now)/1000)), t=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  $("clock").textContent=t; $("stClock").textContent="⏱ "+t; $("clock").classList.toggle("low",s<=30);
}

function beginGame({ players, me, inMs, mode, teacher, board, found, left }){
  Object.assign(G,{ mode, me, teacherView:!!teacher&&teacher===me, teacherRoom:!!teacher, players:new Map(players.map(p=>[p.pid,p])),
    board, found:board.words.map(()=>null), scores:new Map(), startAt:performance.now()+inMs, endAt:performance.now()+inMs+(left??T.time)*1000,
    resultShown:false, drag:null, misses:[], pending:null });
  document.body.classList.toggle("slim",G.teacherRoom&&!G.teacherView);
  document.body.classList.toggle("big",G.teacherView);
  show("game");
  for (const [i,pid,a] of found||[]){ G.found[i]={ pid, a, at:0 }; const pts=board.words[i].length, s=G.scores.get(pid)||{ pts:0, n:0 }; s.pts+=pts; s.n++; G.scores.set(pid,s); }
  renderBank(); countShown=-1;
}

// ============================================================
//  LOOP
// ============================================================
let countShown=-1, last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (screen==="game"){
    const pre=now<G.startAt;
    if (pre){ const c=Math.ceil((G.startAt-now)/1000); if (c!==countShown){ countShown=c; flash(c); } }
    else if (countShown>0){ countShown=0; flash("GO!"); }
    if (G.mode==="solo" && !pre && G.local){ G.local.step(dt); soloEvents(); }
    if (G.pending && now-G.pending.at>1500) G.pending=null;
    clock(now); draw(now);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
//  SOLO vs bots (same rules, in the browser)
// ============================================================
$("bSolo").onclick=()=>{
  const name=myName(); Net.close();
  const names=["Pip","Bubbles","Ziggy","Rosie","Max"];
  const players=[{ pid:1, name, color:0 }, ...names.map((n,i)=>({ pid:i+2, name:n, color:i+1 }))];
  G.local=new WORDS.Game([{ id:1, name, bot:DEMO, lazy:0.5 }, ...names.map((n,i)=>({ id:i+2, name:n, bot:true, lazy:1.1+i*0.2 }))]);
  const b=G.local.board;
  beginGame({ players, me:1, inMs:3000, mode:"solo", board:{ theme:b.theme, cols:b.cols, rows:b.rows, grid:b.grid, words:b.words.map(w=>w.w) } });
};
function soloEvents(){
  for (const e of G.local.drainEvents()){
    if (e[0]==="found") onFound(e[1],e[2],e[3],e[4]);
    if (e[0]==="over") setTimeout(()=>{ if (G.mode==="solo"&&screen==="game"&&!G.resultShown) showResults(G.local.ranking().map(r=>({ ...r, pid:r.id, color:G.players.get(r.id)?.color??0 })),G.local.board.words.length); },1600);
  }
}

// ============================================================
//  RESULTS — top 3 or top 15 % (whichever is more) + your place
// ============================================================
const topCount=n=>Math.min(n,Math.max(3,Math.ceil(n*0.15)));
function showResults(rank,total){
  G.resultShown=true; G.drag=null;
  if (!rank.length){ show("lobby"); renderLobby(); return; }
  const w=rank[0], n=topCount(rank.length);
  $("champ").innerHTML=`<div style="font-size:64px;line-height:1">🔤</div><div class="t">${w.pid===G.me?"You're the word champion!":"Word champion!"}</div><h2>${esc(w.name)}</h2>`;
  const line=(e,i)=>`<div class="line ${i===0?"p1":""} ${e.pid===G.me?"me":""}" style="animation-delay:${i*60}ms"><span class="pos">${i+1}</span><i class="sw" style="background:${pcol(e.color)};color:${pink(e.color)};text-shadow:none">${e.color+1}</i>
    <span class="nm">${esc(e.name)}${e.pid===G.me?" (you)":""}</span><span class="cl">🔎 ${e.words} word${e.words===1?"":"s"}</span><span class="tm">${e.score}</span></div>`;
  $("rBoard").innerHTML=rank.slice(0,n).map(line).join("");
  const mi=rank.findIndex(e=>e.pid===G.me);
  $("rYou").innerHTML=mi>=n?`<span>You · ${mi+1} of ${rank.length}</span><span>${rank[mi].score} points · 🔎 ${rank[mi].words}</span>`:"";
  $("bAgain").textContent=G.mode==="solo"?"Play again":"Back to lobby";
  show("results"); confetti();
}
$("bAgain").onclick=()=>{ if (G.mode==="solo") $("bSolo").click(); else { show("lobby"); renderLobby(); } };
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || DEMO) return;
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:140},(_,i)=>({ x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5, v:2+Math.random()*4, s:5+Math.random()*7, r:Math.random()*6, c:CONF[i%CONF.length] }));
  const t0=performance.now();
  (function f(now){ const age=(now-t0)/1000; x.clearRect(0,0,c.width,c.height);
    for (const p of P){ p.y+=p.v; p.r+=0.08; x.save(); x.globalAlpha=Math.max(0,1-Math.max(0,age-2.8)/1.4); x.translate(p.x+Math.sin(p.r)*14,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); x.restore(); }
    if (age<4.2) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}

// ============================================================
//  NETWORK
// ============================================================
const Net={
  ws:null, want:false, retry:0, queue:[], pid:0, code:null, lobby:null, token:store.get("cg_token"),
  url(){ const s=(window.CG_CONFIG&&CG_CONFIG.server)||""; if (s) return s; if (!location.host) return null; return (location.protocol==="https:"?"wss://":"ws://")+location.host; },
  open(){
    this.want=true; if (this.ws&&this.ws.readyState<=1) return;
    const url=this.url(); if (!url) return err("Online play needs the game server.");
    const ws=this.ws=new WebSocket(url);
    ws.onopen=()=>{ this.retry=0; ws.send(JSON.stringify({ t:"hello", name:myName(), token:this.token, auth:window.ClassKit?ClassKit.auth():undefined })); for (const m of this.queue.splice(0)) ws.send(JSON.stringify(m)); };
    ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch{ return; } onNet(m); };
    ws.onclose=()=>{ if (!this.want) return; if (screen==="menu") err("Can't reach the game server. Retrying…"); setTimeout(()=>this.want&&this.open(),Math.min(5000,500*2**this.retry++)); };
  },
  send(m){ if (this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(m)); else if (this.want){ this.queue.push(m); this.open(); } },
  close(){ this.want=false; if (this.ws) this.ws.close(); this.ws=null; },
};
function onNet(m){
  if (window.ClassKit&&ClassKit.onNet(m)) return;
  if (m.t==="joined" && Net.wantTeacher && m.game===GAME){ Net.wantTeacher=false; Net.send(window.ClassKit?ClassKit.teacherMsg():{ t:"teacher" }); }
  switch (m.t){
    case "welcome": Net.token=m.token; store.set("cg_token",m.token); break;
    case "joined":
      if (m.game!==GAME){ Net.send({ t:"leave" }); Net.close(); show("menu"); return err("That code is for a different game."); }
      Net.pid=m.pid; Net.code=m.code; if (screen==="menu") show("lobby"); break;
    case "lobby": Net.lobby=m; m.at=performance.now(); if (screen==="lobby") renderLobby(); break;
    case "start": beginGame({ players:m.players, me:Net.pid, inMs:m.in, mode:"online", teacher:m.teacher, board:m.board, found:m.found, left:m.left }); break;
    case "f": if (G.mode==="online" && G.board){ onFound(m.i,m.pid,m.a,m.pts); if (G.pending && m.pid!==G.me && sameLine(G.pending.a,m.a)){ G.pending=null; toast(`${esc(nameOf(m.pid))} got there first!`); if (document.body.classList.contains("slim")) flash("Too slow!"); } } break;
    case "miss": if (G.mode==="online"){ G.misses.push({ a:m.a, at:performance.now() }); G.pending=null; } break;
    case "results": if (G.mode==="online") showResults(m.rank,m.total); break;
    case "error": Net.code=null; show("menu"); err(m.msg||"Something went wrong."); break;
  }
}
const sameLine=(a,b)=>(a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3])||(a[0]===b[2]&&a[1]===b[3]&&a[2]===b[0]&&a[3]===b[1]);
let lobbyTimer=0;
function renderLobby(){
  const L=Net.lobby; if (!L) return;
  $("lKind").textContent=L.pub?"Online party":"Private party";
  $("lCode").textContent=L.code;
  $("lCount").textContent=`${L.players.length} / ${L.max} players`;
  $("lGrid").innerHTML=L.players.filter(p=>p.pid!==L.teacher).map(p=>`<span class="chip ${p.pid===Net.pid?"me":""} ${p.connected?"":"away"}"><i style="background:${pcol(p.color)};color:${pink(p.color)};text-shadow:none">${p.color+1}</i>${esc(p.name)}${p.pid===L.host&&!L.teacher?" ★":""}</span>`).join("");
  const host=L.host===Net.pid;
  $("bStart").style.display=host?"":"none";
  clearInterval(lobbyTimer);
  const note=()=>{
    let t=L.state==="playing"?"A game is going on…":host?"You're the host. Start when everyone's in!":"Waiting for the host to start…";
    if (L.autoIn&&L.state==="lobby"){ const s=Math.max(0,Math.ceil((L.autoIn-(performance.now()-L.at))/1000)); t=`Starting by itself in ${s}s`+(host?". Or start now!":""); }
    $("lNote").textContent=(L.pub?"":"Share the code with friends. ")+t;
    teacherLobby(L);
  };
  note(); lobbyTimer=setInterval(note,500);
}
function teacherLobby(L){
  if (!L || !L.teacher) return;
  const iTeach=L.teacher===Net.pid, kids=L.players.filter(p=>p.pid!==L.teacher), t=L.players.find(p=>p.pid===L.teacher);
  $("lCount").textContent=`${kids.length} / ${L.max-1} students`;
  $("lKind").textContent="🍎 Teacher mode · private game";
  $("bStart").textContent="Start for the class"; $("bStart").style.display=iTeach?"":"none";
  $("lNote").textContent=iTeach?"Share this code with your class. You won't play: press Start, then put the board and word bank on the big screen. Students' screens show only the puzzle, so they look up at yours for the words.":`🍎 ${t?t.name:"Your teacher"} will start the game. The word bank will be on the big screen!`;
}
function goOnline(msg){ err(""); myName(); Net.open(); Net.send(msg); }
$("bPublic").onclick=()=>goOnline({ t:"quick", game:GAME });
$("bPrivate").onclick=()=>goOnline({ t:"create", game:GAME });
$("bJoin").onclick=()=>{ const c=$("codeIn").value.trim().toUpperCase(); if (c.length!==4) return err("Party codes are 4 letters."); goOnline({ t:"join", code:c }); };
$("codeIn").addEventListener("keydown",e=>{ if (e.key==="Enter") $("bJoin").click(); });
$("bStart").onclick=()=>Net.send({ t:"start" });
$("bLeave").onclick=()=>{ Net.send({ t:"leave" }); Net.close(); Net.code=null; show("menu"); };
$("bTeacher").onclick=()=>(window.ClassKit?ClassKit.beginTeacher:(go=>go()))(()=>{ Net.wantTeacher=true; goOnline({ t:"create", game:GAME }); });

function exitGame(){
  if (screen==="menu"){ location.href="../"; return; }
  if (Net.ws && Net.ws.readyState===1) Net.ws.send(JSON.stringify({ t:"leave" }));
  Net.close(); Net.code=null; Net.lobby=null; clearInterval(lobbyTimer); G.mode=""; G.local=null; G.board=null;
  document.body.classList.remove("slim","big");
  show("menu");
}
$("exitBtn").onclick=exitGame;
addEventListener("keydown",e=>{ if (e.key==="Escape" && screen!=="menu") exitGame(); });
addEventListener("DOMContentLoaded",()=>{ const q=new URLSearchParams(location.search).get("play"); if (!q) return; history.replaceState(null,"",location.pathname);
  if (q==="public") $("bPublic").click(); else if (q==="private") $("bPrivate").click(); else if (q==="teacher") $("bTeacher").click(); else if (q==="solo") $("bSolo").click(); });
addEventListener("DOMContentLoaded",()=>{ const j=new URLSearchParams(location.search).get("join"); if (!j) return; history.replaceState(null,"",location.pathname);
  $("codeIn").value=j.toUpperCase(); $("bJoin").click(); });

// hub preview: bots find words fast so the feed is lively, then a fresh puzzle
if (DEMO) addEventListener("DOMContentLoaded",()=>{ $("bSolo").click(); G.local.players.forEach(p=>p.lazy*=0.25); G.local.players.forEach(p=>p.next=G.local.botDelay(p));
  let rs=0; setInterval(()=>{ if (screen==="results"){ if (++rs>5){ rs=0; $("bSolo").click(); G.local.players.forEach(p=>{ p.lazy*=0.25; p.next=G.local.botDelay(p); }); } } else rs=0; },1000); });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SPLAT! · Joshua Game Hub</title>
<meta name="theme-color" content="#8fd3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#7cc8ff; --sky2:#d4f0ff; --grass:#62c04a; --grass2:#4aa63a;
    --ink:#1d2b3a; --ink2:#4b5d70; --card:#ffffff; --line:#e3ecf5;
    --water:#3fa9f5; --water2:#1e7fd8; --pop:#ff5d73; --sun:#ffd23f;
    --f:"Fredoka",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--f);color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 55%,var(--grass2));
    -webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  button,input{font-family:inherit}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
  .screen.on{display:flex}
  .bounce-in{animation:bin .45s cubic-bezier(.2,1.5,.4,1)}
  @keyframes bin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

  /* ---------- cards & buttons ---------- */
  .card{width:100%;max-width:520px;background:var(--card);border-radius:28px;padding:28px;box-shadow:0 10px 0 #b9d7ee,0 30px 60px -20px rgba(20,60,110,.45);
    display:flex;flex-direction:column;gap:16px;position:relative}
  .logo{margin:0;text-align:center;font-weight:700;font-size:64px;line-height:1;letter-spacing:1px;color:var(--water);
    text-shadow:0 5px 0 var(--water2),0 10px 18px rgba(30,127,216,.35);transform:rotate(-3deg)}
  .logo span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
  .logo span:nth-child(2){animation-delay:.15s}.logo span:nth-child(3){animation-delay:.3s}.logo span:nth-child(4){animation-delay:.45s}.logo span:nth-child(5){animation-delay:.6s}.logo span:nth-child(6){animation-delay:.75s;color:var(--pop);text-shadow:0 5px 0 #c73a50}
  @keyframes wob{50%{transform:translateY(-6px) rotate(3deg)}}
  .tag{text-align:center;margin:-4px 0 0;color:var(--ink2);font-size:17px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink2)}
  input.f{width:100%;border:3px solid var(--line);border-radius:16px;padding:13px 16px;font-size:18px;color:var(--ink);outline:none;background:#f7fbff}
  input.f:focus{border-color:var(--water)}
  .btn{appearance:none;border:0;border-radius:18px;padding:15px 18px;font-size:18px;font-weight:600;cursor:pointer;color:#fff;background:var(--water);
    box-shadow:0 6px 0 var(--water2);transition:transform .08s,box-shadow .08s,filter .15s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--water2)}
  .btn.alt{background:#fff;color:var(--water2);box-shadow:0 6px 0 #cfe2f2;border:3px solid #cfe2f2}
  .btn.pop{background:var(--pop);box-shadow:0 6px 0 #c73a50}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
  .err{min-height:1.2em;margin:0;color:var(--pop);text-align:center;font-weight:500}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .how div{background:#f2f8ff;border-radius:16px;padding:12px;text-align:center;font-size:14px;color:var(--ink2);line-height:1.3}
  .how b{display:block;font-size:26px;margin-bottom:4px}
  a.back{position:absolute;top:18px;left:22px;color:var(--ink2);font-weight:600;text-decoration:none;font-size:14px}
  a.back:hover{color:var(--water2)}

  /* ---------- lobby ---------- */
  .code{font-size:52px;font-weight:700;letter-spacing:10px;text-align:center;color:var(--water2);line-height:1}
  .crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:18px;background:#f2f8ff;min-width:0}
  .mate svg{width:58px;height:58px}
  .mate span{font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mate small{font-size:12px;color:var(--ink2)}
  .mate.empty{opacity:.45;border:3px dashed #cfe2f2;background:transparent}
  .note{text-align:center;color:var(--ink2);margin:0}

  /* ---------- game ---------- */
  #game{padding:0;flex-direction:column;align-items:stretch;justify-content:flex-start}
  .top{display:flex;gap:8px;padding:10px 46px 6px 12px;overflow-x:auto;flex:none}
  .pchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 rgba(30,90,150,.18);
    flex:none;transition:transform .2s,opacity .2s}
  .pchip svg{width:34px;height:34px}
  .pchip b{font-weight:600;font-size:15px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip i{font-style:normal;font-weight:700;color:var(--water2);font-size:15px}
  .pchip em{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--pop);border-radius:999px;padding:2px 7px}
  .pchip.splatted{opacity:.55}
  .pchip.splatted em{background:var(--water)}
  .pchip.me{box-shadow:0 0 0 3px var(--water),0 3px 0 rgba(30,90,150,.18)}
  .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#7cc8ff,#d4f0ff 50%,#6fcd55 50%,#47a136)}
  #scene{width:100%;height:100%;display:block}
  .banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;
    padding:8px 10px 8px 22px;box-shadow:0 6px 0 rgba(30,90,150,.22),0 18px 30px -12px rgba(20,60,110,.5);white-space:nowrap;max-width:calc(100% - 20px)}
  .banner .msg{font-size:clamp(16px,2.6vw,26px);font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .banner .msg small{font-weight:500;color:var(--ink2);font-size:.7em;margin-left:6px}
  .timer{position:relative;width:52px;height:52px;flex:none}
  .timer svg{width:100%;height:100%;transform:rotate(-90deg)}
  .timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700}
  .timer.hot b{color:var(--pop);animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(1.18)}}
  .timer[hidden]{display:none}
  .pop-in{animation:bin .35s cubic-bezier(.2,1.5,.4,1)}
  .controls{flex:none;display:flex;justify-content:center;gap:12px;padding:8px 12px 14px}
  .ctl{width:min(30vw,150px);height:64px;border-radius:20px;border:0;background:#fff;color:var(--ink);font-size:26px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 0 #b9d7ee;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s,background .15s,opacity .2s}
  .ctl small{font-size:14px;font-weight:600;color:var(--ink2)}
  .ctl.sel{background:var(--water);color:#fff;box-shadow:0 6px 0 var(--water2)}
  .ctl.sel small{color:#e3f3ff}
  .ctl.press{transform:translateY(4px);box-shadow:0 2px 0 #b9d7ee}
  .ctl:disabled{opacity:.35;cursor:default}
  .controls.throwing .ctl:not(:disabled){background:#fff1f3;box-shadow:0 6px 0 #f5b8c2}
  .controls.throwing .ctl:not(:disabled):hover{background:var(--pop);color:#fff}

  /* scene animation helpers */
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
  #sheet{transition:transform .5s cubic-bezier(.5,-0.3,.6,1),opacity .35s ease-in}
  #sheet.down{transform:translateY(-640px) rotate(-2deg);opacity:0!important}
  #sheetCloth{animation:sway 3s ease-in-out infinite;transform-origin:800px 300px}
  @keyframes sway{50%{transform:skewX(1.2deg)}}
  .peek{transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
  .aim{opacity:0;transition:opacity .15s}
  .aim.on{opacity:1;animation:aimp .6s ease-in-out infinite alternate}
  @keyframes aimp{to{opacity:.4}}
  .shake{animation:shake .5s}
  @keyframes shake{20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-6px,4px)}80%{transform:translate(4px,-2px)}}

  /* full-screen splat for the splatted player */
  #splatFx{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
  #splatFx.on{display:block}
  #splatFx svg{position:absolute;inset:-10%;width:120%;height:120%;animation:splatIn .25s cubic-bezier(.2,1.6,.4,1),splatOut .6s ease-in 1.5s forwards}
  #splatFx .drop{position:absolute;top:-4%;width:var(--w);height:var(--h);border-radius:0 0 999px 999px;background:linear-gradient(#5ec3ff,#3fa9f5);opacity:.85;animation:drip 1.7s cubic-bezier(.5,0,.8,.6) var(--d) forwards}
  #splatFx .drop::after{content:"";position:absolute;left:50%;bottom:calc(var(--w)*-0.7);transform:translateX(-50%);width:calc(var(--w)*1.5);height:calc(var(--w)*1.5);border-radius:50%;background:#3fa9f5}
  #splatFx .say{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,9vw,110px);font-weight:700;color:#fff;
    text-shadow:0 6px 0 var(--water2),0 0 40px rgba(0,60,140,.5);animation:splatIn .3s cubic-bezier(.2,1.6,.4,1) .1s backwards,splatOut .6s ease-in 1.5s forwards;text-align:center;line-height:1}
  #splatFx .say small{display:block;font-size:.35em;font-weight:600;margin-top:10px}
  @keyframes splatIn{from{transform:scale(.3);opacity:0}}
  @keyframes splatOut{to{opacity:0;transform:scale(1.08)}}
  @keyframes drip{to{transform:translateY(55vh)}}

  /* turn recap */
  .recap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(124,200,255,.35);backdrop-filter:blur(3px)}
  .recap.on{display:flex}
  .recap .card{max-width:420px;align-items:center;text-align:center;gap:8px}
  .recap svg.av{width:96px;height:96px}
  .recap h3{margin:0;font-size:28px}
  .recap p{margin:0;color:var(--ink2);font-size:17px}
  .recap .gain{font-size:22px;font-weight:700;color:var(--pop)}

  /* final */
  #final .card{max-width:640px;text-align:center;align-items:stretch;background:linear-gradient(#fff,#f3f9ff)}
  .champ{display:flex;flex-direction:column;align-items:center;gap:4px}
  .champ svg{width:130px;height:150px;filter:drop-shadow(0 10px 14px rgba(30,90,150,.3));animation:wob 2.2s ease-in-out infinite}
  .champ .t{font-size:15px;letter-spacing:3px;font-weight:700;color:var(--pop);text-transform:uppercase}
  .champ h2{margin:0;font-size:40px;line-height:1.05}
  .table{display:flex;flex-direction:column;gap:8px;text-align:left}
  .tr{display:grid;grid-template-columns:34px 40px 1fr repeat(4,minmax(46px,auto));align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:#f2f8ff;
    animation:bin .4s cubic-bezier(.2,1.5,.4,1) backwards}
  .tr.head{background:transparent;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;padding-top:0;padding-bottom:0;animation:none}
  .tr.first{background:#fff4c7;box-shadow:inset 0 0 0 3px var(--sun)}
  .tr.me{box-shadow:inset 0 0 0 3px var(--water)}
  .tr .pos{font-weight:700;font-size:20px;color:var(--ink2)}
  .tr svg{width:36px;height:36px}
  .tr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tr .n{text-align:center;font-weight:600}
  .tr .pts{font-weight:700;color:var(--water2);font-size:20px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:31}

  /* exit */
  #exitBtn{position:fixed;top:10px;right:10px;z-index:40;width:28px;height:28px;padding:0;border-radius:50%;display:grid;place-items:center;
    background:#fff;border:0;color:var(--ink2);box-shadow:0 3px 0 rgba(30,90,150,.25);cursor:pointer}
  #exitBtn:hover,#exitBtn:focus-visible{color:var(--pop);outline:none}

  @media (max-width:620px){
    .logo{font-size:52px}
    .card{padding:22px}
    .how{grid-template-columns:1fr}
    .ctl{height:58px;font-size:24px}
    .ctl small{display:none}
    .tr{grid-template-columns:26px 32px 1fr repeat(4,minmax(30px,auto));font-size:14px;gap:6px;padding:8px}
    .tr .pts{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="/assets/hub-frame.js" defer></script>
</head>
<body>
<button id="exitBtn" type="button" title="Back to game hub" aria-label="Back to game hub"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

<!-- MENU -->
<section class="screen on" id="menu"><div class="card bounce-in">
  <h1 class="logo" aria-label="SPLAT!"><span>S</span><span>P</span><span>L</span><span>A</span><span>T</span><span>!</span></h1>
  <p class="tag">Hide behind a barrel. Dodge the SPLAT!</p>
  <div class="how">
    <div><b>🛢️</b>Pick a barrel with ← ↑ → before time runs out</div>
    <div><b>🎈</b>Everyone takes a turn with the water balloon</div>
    <div><b>💦</b>Stay dry for points. SPLAT! friends for more</div>
  </div>
  <div><div class="lbl" style="margin-bottom:6px">Your name</div><input class="f" id="nameIn" maxlength="14" placeholder="Type a name" autocomplete="off"></div>
  <div class="row"><button class="btn" id="bPublic">Play online</button><button class="btn pop" id="bPrivate">Private party</button></div>
  <div class="row"><input class="f" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:600"><button class="btn alt" id="bJoin" style="flex:0 0 auto">Join</button></div>
  <p class="err" id="err"></p>
</div></section>

<!-- LOBBY -->
<section class="screen" id="lobby"><div class="card">
  <div class="lbl" id="lKind" style="text-align:center">Private party</div>
  <div class="code" id="lCode">----</div>
  <div class="crew" id="lCrew"></div>
  <p class="note" id="lNote"></p>
  <div class="row"><button class="btn pop" id="bStart">Start!</button><button class="btn alt" id="bLeave" style="flex:0 0 auto">Leave</button></div>
</div></section>

<!-- GAME -->
<section class="screen" id="game">
  <div class="top" id="chips"></div>
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Backyard with three barrels">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#d4f0ff"/></linearGradient>
        <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcd55"/><stop offset="1" stop-color="#47a136"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b4d1f"/><stop offset=".45" stop-color="#cf8746"/><stop offset="1" stop-color="#8b4d1f"/></linearGradient>
        <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#fffaf0"/><circle cx="15" cy="15" r="8" fill="#ffd6de"/><circle cx="45" cy="45" r="8" fill="#cfe9ff"/></pattern>
        <radialGradient id="balloonG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#3fa9f5"/><stop offset="1" stop-color="#1e7fd8"/></radialGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#sky)"/>
      <circle cx="1420" cy="120" r="70" fill="#ffd23f"/><circle cx="1420" cy="120" r="96" fill="#ffd23f" opacity=".25"/>
      <g class="cloud" style="animation-duration:70s"><g fill="#fff" opacity=".95"><ellipse cx="200" cy="130" rx="90" ry="38"/><ellipse cx="260" cy="110" rx="70" ry="45"/><ellipse cx="140" cy="118" rx="55" ry="32"/></g></g>
      <g class="cloud" style="animation-duration:95s;animation-delay:-40s"><g fill="#fff" opacity=".85"><ellipse cx="200" cy="220" rx="70" ry="28"/><ellipse cx="245" cy="205" rx="55" ry="34"/></g></g>
      <!-- fence -->
      <g fill="#fff3df" stroke="#e8d3b4" stroke-width="3">
        <rect x="0" y="352" width="1600" height="16" rx="4"/><rect x="0" y="412" width="1600" height="16" rx="4"/>
        <g id="pickets"></g>
      </g>
      <rect y="450" width="1600" height="450" fill="url(#grassG)"/>
      <g fill="#58b443" opacity=".7" id="tufts"></g>
      <!-- avatars peeking (drawn BEHIND barrels) -->
      <g id="peeks"></g>
      <!-- barrels -->
      <g id="barrels"></g>
      <!-- revealed / splatted players stand in front -->
      <g id="reveal"></g>
      <!-- sheet on a clothesline -->
      <g id="sheet">
        <rect x="292" y="250" width="18" height="430" rx="6" fill="#9a6337"/><rect x="1290" y="250" width="18" height="430" rx="6" fill="#9a6337"/>
        <path d="M300,262 Q800,300 1300,262" stroke="#6b7a8c" stroke-width="4" fill="none"/>
        <g id="sheetCloth">
          <path d="M318,272 Q800,312 1282,272 L1282,662 Q1222,682 1162,662 T1042,662 T922,662 T802,662 T682,662 T562,662 T442,662 T318,666 Z" fill="url(#dots)" stroke="#e9dccb" stroke-width="4"/>
          <path d="M318,272 Q800,312 1282,272 L1282,300 Q800,340 318,300 Z" fill="#000" opacity=".05"/>
          <g fill="#ff8fa3"><rect x="430" y="270" width="16" height="34" rx="4"/><rect x="792" y="284" width="16" height="34" rx="4"/><rect x="1154" y="270" width="16" height="34" rx="4"/></g>
        </g>
      </g>
      <!-- aim markers -->
      <g id="aims"></g>
      <!-- thrower in the foreground -->
      <g id="thrower" transform="translate(190,770)"></g>
      <g id="balloon" style="display:none"><ellipse rx="34" ry="40" fill="url(#balloonG)"/><path d="M-6,38 L6,38 L0,48 Z" fill="#1e7fd8"/><ellipse cx="-11" cy="-14" rx="9" ry="13" fill="#fff" opacity=".55"/></g>
      <g id="bursts"></g>
    </svg>
    <div class="banner" id="banner"><div class="msg" id="bMsg">Get ready!</div>
      <div class="timer" id="timer"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="#eef6ff"/><circle id="ring" cx="26" cy="26" r="22" fill="none" stroke="#3fa9f5" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><b id="tNum">10</b></div></div>
    <div class="recap" id="recap"><div class="card bounce-in" id="recapCard"></div></div>
  </div>
  <div class="controls" id="controls">
    <button class="ctl" data-b="0" type="button">← <small>Left</small></button>
    <button class="ctl" data-b="1" type="button">↑ <small>Middle</small></button>
    <button class="ctl" data-b="2" type="button">→ <small>Right</small></button>
  </div>
</section>

<!-- FINAL -->
<section class="screen" id="final"><div class="card">
  <div class="champ" id="champ"></div>
  <div class="table" id="fTable"></div>
  <div class="row"><button class="btn pop" id="bAgain">Back to lobby</button><a class="btn alt" href="../" style="text-align:center;text-decoration:none;flex:0 0 auto">Game hub</a></div>
</div></section>

<div id="splatFx"></div>
<canvas id="confetti"></canvas>

<script src="../config.js" onerror="window.CG_CONFIG={server:''}"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={ get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };
const COLORS=["#ff5d73","#ffb627","#22b8cf","#8b5cf6","#43c463","#ff8a3d"];
const BX=[480,800,1120], BTOP=468;            // barrel centres + top edge in scene units
const NS="http://www.w3.org/2000/svg";

// ============================================================
//  ART — round buddies, barrels, scenery (all original SVG)
// ============================================================
function avatar(color,mood="happy"){
  const k="#1d2b3a";
  const eyes={
    happy:`<ellipse cx="-17" cy="-6" rx="8" ry="10" fill="#fff"/><ellipse cx="17" cy="-6" rx="8" ry="10" fill="#fff"/><circle cx="-15" cy="-4" r="5" fill="${k}"/><circle cx="19" cy="-4" r="5" fill="${k}"/>`,
    worried:`<ellipse cx="-17" cy="-6" rx="8" ry="11" fill="#fff"/><ellipse cx="17" cy="-6" rx="8" ry="11" fill="#fff"/><circle cx="-20" cy="-2" r="5" fill="${k}"/><circle cx="14" cy="-2" r="5" fill="${k}"/><path d="M-27,-20 L-10,-16 M27,-20 L10,-16" stroke="${k}" stroke-width="4" stroke-linecap="round"/>`,

// hiders peek over the barrel tops (only for non-throwers, only while hiding/locked)
function renderPeeks(){

  let out="";

const KEYMAP={ ArrowLeft:0, KeyA:0, ArrowUp:1, KeyW:1, ArrowRight:2, KeyD:2 };
function choose(b){
  if (S.phase==="hide" && amHiding()){
    if (S.myPick===b) return;
    S.myPick=b; Net.send({ t:"pick", b }); renderPeeks(); renderControls();
  } else if (S.phase==="throw" && amThrower() && !S.thrown){
    S.thrown=true; Net.send({ t:"throw", b });
    document.querySelectorAll(".aim").forEach((a,i)=>a.classList.toggle("on",i===b));
  }
}
addEventListener("keydown",e=>{
  if (e.target.tagName==="INPUT") return;

  const b=KEYMAP[e.code]; if (b==null || screen!=="game") return;

  choose(b);
});

function throwAnim(b,done){
  const bl=$("balloon"); bl.style.display="";
  const x0=300,y0=690, x1=BX[b], y1=BTOP+40, t0=performance.now(), T=520;
  (function step(now){
    const k=Math.min(1,(now-t0)/T), x=x0+(x1-x0)*k, y=y0+(y1-y0)*k-Math.sin(Math.PI*k)*300;
    bl.setAttribute("transform",`translate(${x},${y}) rotate(${k*360})`);
    if (k<1) requestAnimationFrame(step); else { bl.style.display="none"; done(); }
  })(t0);
  $("thrower").querySelector("g:nth-child(2)")?.setAttribute("opacity","0");
}
function burst(b){
  const x=BX[b], y=BTOP+40; let drops="";
  for (let i=0;i<14;i++){ const a=i/14*Math.PI*2, r=90+Math.random()*90;
    drops+=`<circle cx="${x}" cy="${y}" r="${8+Math.random()*10}" fill="#5ec3ff"><animate attributeName="cx" to="${x+Math.cos(a)*r}" dur=".5s" fill="freeze"/><animate attributeName="cy" to="${y+Math.sin(a)*r*0.7+40}" dur=".5s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin=".35s" dur=".6s" fill="freeze"/></circle>`; }
  $("bursts").innerHTML=`<g><path transform="translate(${x},${y}) scale(1.6)" d="${SPLAT_PATH}" fill="#3fa9f5" opacity=".9"><animateTransform attributeName="transform" type="scale" additive="sum" from=".2" to="1" dur=".25s"/><animate attributeName="opacity" from=".9" to="0" begin=".5s" dur=".9s" fill="freeze"/></path>${drops}
    <text x="${x}" y="${y-110}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="72" fill="#fff" stroke="#1e7fd8" stroke-width="8" paint-order="stroke">SPLAT!<animate attributeName="opacity" from="1" to="0" begin="1s" dur=".6s" fill="freeze"/></text></g>`;
  $("stage").classList.remove("shake"); void $("stage").offsetWidth; $("stage").classList.add("shake");
}
const SPLAT_PATH="M0,-60 C14,-62 18,-40 30,-44 C46,-50 40,-74 58,-70 C72,-66 62,-40 54,-28 C66,-24 88,-30 90,-14 C92,2 70,0 62,10 C74,22 92,30 82,46 C72,60 54,42 44,48 C46,64 40,84 22,80 C6,76 12,56 0,52 C-12,58 -10,80 -28,78 C-44,74 -38,54 -46,44 C-58,52 -80,58 -84,40 C-88,24 -66,20 -60,10 C-72,0 -92,-6 -88,-22 C-82,-38 -60,-26 -52,-32 C-58,-46 -66,-66 -48,-70 C-30,-74 -26,-50 -14,-52 C-14,-62 -10,-60 0,-60 Z";
function reveal(pos,hit){
  const groups=[[],[],[]]; for (const [pid,b] of Object.entries(pos)) groups[b].push(+pid);
  let out="";
  groups.forEach((g,i)=>{ const n=g.length, sp=Math.min(70,190/Math.max(1,n-1));
    g.forEach((pid,j)=>{ const x=BX[i]+(n>1?(j-(n-1)/2)*sp:0), wet=hit.includes(pid);
      out+=`<g transform="translate(${x},${BTOP-44}) scale(.8)"><g>${avatar(col(pid),wet?"splatted":"cheer")}<animateTransform attributeName="transform" type="translate" from="0 80" to="0 0" dur=".3s"/></g></g>`; }); });
  $("reveal").innerHTML=out;
}
function fullSplat(){
  const fx=$("splatFx");
  let drips=""; for (let i=0;i<10;i++){ drips+=`<i class="drop" style="left:${4+i*9.6+Math.random()*3}%;--w:${10+Math.random()*12}px;--h:${12+Math.random()*16}vh;--d:${(.15+Math.random()*.5).toFixed(2)}s"></i>`; }
  fx.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path transform="translate(50,46) scale(.62)" d="${SPLAT_PATH}" fill="#3fa9f5" opacity=".88"/>
    <path transform="translate(22,24) scale(.16)" d="${SPLAT_PATH}" fill="#5ec3ff" opacity=".9"/><path transform="translate(80,76) scale(.2)" d="${SPLAT_PATH}" fill="#5ec3ff" opacity=".9"/>
    <path transform="translate(84,18) scale(.1)" d="${SPLAT_PATH}" fill="#1e7fd8" opacity=".8"/></svg>${drips}

  fx.classList.remove("on"); void fx.offsetWidth; fx.classList.add("on");

function startPhase(phase,dur){ S.phase=phase; S.dur=dur||1; S.endAt=performance.now()+(dur||0); }
function onTurn(m){
  S.thrower=m.thrower; S.n=m.n; S.of=m.of; S.alive=new Set(m.alive); S.scores=m.scores; S.pos={}; S.myPick=null; S.throwN=0;
  $("reveal").innerHTML=""; $("bursts").innerHTML=""; $("recap").classList.remove("on");
  startPhase("intro",m.dur); setSheet(true); renderThrower(); renderChips(); renderPeeks(); renderControls(); phaseBanner();
  if (screen!=="game") show("game");
}
function onPhase(m){
  S.throwN=m.throw; S.alive=new Set(m.alive); S.thrown=false;
  if (m.phase==="hide"){ S.pos={}; S.myPick=null; $("reveal").innerHTML=""; $("bursts").innerHTML=""; }
  startPhase(m.phase,m.dur);
  document.querySelectorAll(".aim").forEach(a=>a.classList.remove("on"));
  setSheet(m.phase==="hide"); renderThrower(); renderChips(); renderPeeks(); renderControls(); phaseBanner();
}
function onSplash(m){
  startPhase("splash",m.dur); renderControls(); $("peeks").innerHTML="";
  const wasHiding=S.alive.has(S.pid);
  throwAnim(m.barrel,()=>{
    burst(m.barrel); reveal(m.pos,m.hit);
    S.alive=new Set(m.alive); S.scores=m.scores; renderChips();
    const names=m.hit.map(nm);
    if (m.hit.includes(S.pid) && wasHiding) fullSplat();
    if (!m.hit.length) banner(`😅 Missed! Everyone stayed dry`,false);
    else if (amThrower()) banner(`💦 SPLAT! You splatted ${esc(list(names))}! <small>+${20*m.hit.length}</small>`,false);
    else banner(`💦 SPLAT! ${esc(list(names))} got splatted!`,false);
  });
}
function onTurnEnd(m){
  startPhase("turnEnd",m.dur); S.scores=m.scores; renderChips(); renderControls();
  const c=col(m.thrower), who=m.thrower===S.pid?"You":esc(nm(m.thrower));
  $("recapCard").innerHTML=`<svg class="av" viewBox="-56 -62 112 118">${avatar(c,m.splatted?"cheer":"worried")}</svg>
    <h3>${who} splatted ${m.splatted} ${m.splatted===1?"friend":"friends"}!</h3>
    ${m.splatted?`<div class="gain">+${m.gained} points</div>`:""}
    <p>${m.dry.length?`Still dry: ${esc(list(m.dry.map(nm)))} 🌞`:"Nobody stayed dry this time! 💧"}</p>
    <p style="font-size:14px">${S.n<S.of?`Next balloon in a moment…`:`Final scores coming up!`}</p>`;
  $("recap").classList.add("on");
  const card=$("recapCard"); card.classList.remove("bounce-in"); void card.offsetWidth; card.classList.add("bounce-in");
}
function onSync(m){
  S.players=new Map(m.players.map(p=>[p.pid,p]));
  onTurn({ thrower:m.thrower, n:m.n, of:m.of, alive:m.alive, scores:m.scores, dur:m.left });
  if (m.phase==="hide"||m.phase==="throw"){ S.pos=m.pos||{}; onPhase({ phase:m.phase, throw:m.throw, dur:m.left, alive:m.alive }); }
}
function showFinal(rank){
  $("recap").classList.remove("on");
  const w=rank[0];
  const tie=rank.length>1&&rank[1].points===w.points;
  $("champ").innerHTML=`<svg viewBox="-60 -110 120 170"><g transform="translate(0,-74)"><path d="M-34,10 L-40,-24 L-18,-6 L0,-34 L18,-6 L40,-24 L34,10 Z" fill="#ffd23f" stroke="#e0a800" stroke-width="4" stroke-linejoin="round"/><circle cx="0" cy="-34" r="6" fill="#ff5d73"/><circle cx="-40" cy="-24" r="5" fill="#22b8cf"/><circle cx="40" cy="-24" r="5" fill="#43c463"/></g>${avatar(COLORS[w.color],"cheer")}</svg>
    <div class="t">${tie?"Tied for the win!":"SPLAT! champion!"}</div><h2>${esc(tie?rank.filter(r=>r.points===w.points).map(r=>r.name).join(" & "):w.name)}</h2>`;
  let pos=0;
  $("fTable").innerHTML=`<div class="tr head"><span></span><span></span><span>Player</span><span class="n">Dodged</span><span class="n">SPLAT!s</span><span class="n">Got hit</span><span class="n">Points</span></div>`+
    rank.map((r,i)=>{ if (!i||r.points!==rank[i-1].points) pos=i+1;
      return `<div class="tr ${pos===1?"first":""} ${r.pid===S.pid?"me":""}" style="animation-delay:${.15+i*.08}s"><span class="pos">${pos}</span>${avatarSvg(COLORS[r.color],pos===1?"cheer":"happy")}
        <span class="nm">${esc(r.name)}${r.pid===S.pid?" (you)":""}</span><span class="n" title="Throws dodged">🌞 ${r.dodged}</span><span class="n" title="Friends you SPLAT!-ed">🎈 ${r.splashes}</span><span class="n" title="Times you got SPLAT!-ed">💦 ${r.splatted}</span><span class="n pts">${r.points}</span></div>`; }).join("");
  show("final"); confetti();

// water-drop + balloon confetti
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:120},()=>({ x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.6, v:2+Math.random()*4, s:6+Math.random()*10, w:Math.random()*6.28,
    c:[...COLORS,"#3fa9f5","#5ec3ff"][Math.random()*8|0], drop:Math.random()<0.5 }));
  const t0=performance.now();
  (function f(now){ const age=(now-t0)/1000; x.clearRect(0,0,c.width,c.height);
    for (const p of P){ p.y+=p.v; p.w+=0.05; const px=p.x+Math.sin(p.w)*20; x.globalAlpha=Math.max(0,1-Math.max(0,age-3)/1.5); x.fillStyle=p.c; x.beginPath();
      if (p.drop){ x.moveTo(px,p.y-p.s); x.quadraticCurveTo(px+p.s*.8,p.y+p.s*.3,px,p.y+p.s*.6); x.quadraticCurveTo(px-p.s*.8,p.y+p.s*.3,px,p.y-p.s); }
      else x.ellipse(px,p.y,p.s*.6,p.s*.75,0,0,7); x.fill(); }
    if (age<4.5) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}

// scene fit: fill the stage when it is wide (crop a little sky/grass), fit everything when tall
function fitScene(){ const st=$("stage"); if (!st.clientWidth) return; $("scene").setAttribute("preserveAspectRatio", st.clientWidth/st.clientHeight>=1.25?"xMidYMid slice":"xMidYMid meet"); }
addEventListener("resize",fitScene); new ResizeObserver(fitScene).observe($("stage"));

// timer ring
(function loop(now){
  if (screen==="game" && (S.phase==="hide"||S.phase==="throw")){
    const left=Math.max(0,S.endAt-now), s=Math.ceil(left/1000);
    $("tNum").textContent=s; $("ring").style.strokeDashoffset=138.2*(1-left/S.dur);
    $("timer").classList.toggle("hot",s<=2);
  }
  requestAnimationFrame(loop);
})(performance.now());

// ============================================================
//  NETWORK
// ============================================================
const Net={
  ws:null, want:false, retry:0, queue:[], code:null, lobby:null, token:store.get("cg_token"),
  url(){ const s=(window.CG_CONFIG&&CG_CONFIG.server)||""; if (s) return s; if (!location.host) return null; return (location.protocol==="https:"?"wss://":"ws://")+location.host; },
  open(){
    this.want=true; if (this.ws&&this.ws.readyState<=1) return;
    const url=this.url(); if (!url) return err("Online play needs the game server.");
    const ws=this.ws=new WebSocket(url);
    ws.onopen=()=>{ this.retry=0; ws.send(JSON.stringify({ t:"hello", name:myName(), token:this.token })); for (const m of this.queue.splice(0)) ws.send(JSON.stringify(m)); };
    ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch{ return; } onNet(m); };
    ws.onclose=()=>{ if (!this.want) return; if (screen==="menu") err("Can't reach the game server. Retrying…"); setTimeout(()=>this.want&&this.open(),Math.min(5000,500*2**this.retry++)); };
  },
  send(m){ if (this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(m)); else { this.queue.push(m); this.open(); } },
  close(){ this.want=false; if (this.ws) this.ws.close(); this.ws=null; },
};
function onNet(m){
  switch (m.t){
    case "welcome": Net.token=m.token; store.set("cg_token",m.token); break;
    case "joined":
      if (m.game!=="splat"){ Net.send({ t:"leave" }); Net.close(); show("menu"); return err("That code is for a different game."); }
      S.pid=m.pid; Net.code=m.code; if (screen==="menu") show("lobby"); break;
    case "lobby": Net.lobby=m; m.at=performance.now(); if (m.state==="lobby") S.players=new Map(m.players.map(p=>[p.pid,p])); if (screen==="lobby") renderLobby(); break;
    case "begin": S.players=new Map(m.players.map(p=>[p.pid,p])); S.scores={}; show("game"); break;
    case "roster": S.players=new Map(m.players.map(p=>[p.pid,p])); S.alive=new Set(m.alive); renderChips(); break;
    case "turn": onTurn(m); break;
    case "phase": onPhase(m); break;
    case "hidepos": S.pos=m.pos; renderPeeks(); break;
    case "splash": onSplash(m); break;
    case "turnEnd": onTurnEnd(m); break;
    case "final": S.phase=""; showFinal(m.rank); break;
    case "sync": onSync(m); break;
    case "error": Net.code=null; show("menu"); err(m.msg||"Something went wrong."); break;
  }
}
let lobbyTimer=0;
function renderLobby(){
  const L=Net.lobby; if (!L) return;
  $("lKind").textContent=L.pub?"Online party":"Private party";
  $("lCode").textContent=L.code;
  const slots=[...L.players]; while (slots.length<L.max) slots.push(null);
  $("lCrew").innerHTML=slots.map(p=>p?`<div class="mate">${avatarSvg(COLORS[p.color],p.pid===L.host?"sly":"happy")}<span>${esc(p.name)}</span><small>${p.pid===S.pid?"you":p.pid===L.host?"host ★":p.connected?"ready":"away"}</small></div>`
    :`<div class="mate empty"><svg viewBox="-56 -62 112 118"><circle r="50" fill="none" stroke="#b9d7ee" stroke-width="6" stroke-dasharray="14 10"/></svg><span>&nbsp;</span><small>open</small></div>`).join("");
  const host=L.host===S.pid, enough=L.players.filter(p=>p.connected).length>=L.min;
  $("bStart").style.display=host?"":"none"; $("bStart").disabled=!enough;
  clearInterval(lobbyTimer);
  const note=()=>{
    let t=L.state==="playing"?"A game is going on…":!enough?`Waiting for friends (${L.min}–${L.max} players)… share the code!`:host?"Press Start when everyone's here!":"Waiting for the host to start…";
    if (L.autoIn&&L.state==="lobby"){ const s=Math.max(0,Math.ceil((L.autoIn-(performance.now()-L.at))/1000)); t=`Starting by itself in ${s}s`+(host?". Or press Start!":""); }
    $("lNote").textContent=t;
  };
  note(); lobbyTimer=setInterval(note,500);
}
function goOnline(msg){ err(""); myName(); Net.open(); Net.send(msg); }
$("bPublic").onclick=()=>goOnline({ t:"quick", game:"splat" });
$("bPrivate").onclick=()=>goOnline({ t:"create", game:"splat" });
$("bJoin").onclick=()=>{ const c=$("codeIn").value.trim().toUpperCase(); if (c.length!==4) return err("Party codes are 4 letters."); goOnline({ t:"join", code:c }); };
$("codeIn").addEventListener("keydown",e=>{ if (e.key==="Enter") $("bJoin").click(); });
$("bStart").onclick=()=>Net.send({ t:"start" });
$("bLeave").onclick=()=>{ Net.send({ t:"leave" }); Net.close(); Net.code=null; show("menu"); };
function exitGame(){
  if (screen==="menu"){ location.href="../"; return; }
  if (Net.ws && Net.ws.readyState===1) Net.ws.send(JSON.stringify({ t:"leave" }));
  Net.close(); Net.code=null; Net.lobby=null; S.phase=""; clearInterval(lobbyTimer);
  $("recap").classList.remove("on"); $("splatFx").classList.remove("on");
  show("menu");
}
$("exitBtn").onclick=exitGame;
addEventListener("DOMContentLoaded",()=>{ const q=new URLSearchParams(location.search).get("play"); if (!q) return; history.replaceState(null,"",location.pathname);
  if (q==="public") $("bPublic").click(); else if (q==="private") $("bPrivate").click(); });
// hub "Have a code?" deep link: ?join=CODE
addEventListener("DOMContentLoaded",()=>{ const j=new URLSearchParams(location.search).get("join"); if (!j) return; history.replaceState(null,"",location.pathname);
  $("codeIn").value=j.toUpperCase(); $("bJoin").click(); });
</script>

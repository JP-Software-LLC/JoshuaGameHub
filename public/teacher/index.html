<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Dashboard · Joshua Game Hub</title>
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0d12; --p1:#141922; --p2:#1b2230; --edge:#2a3344; --ink:#eef1f6; --dim:#97a2b3; --mute:#647083; --acc:#ff6b6b; --acc2:#ffb3b3; --ok:#4ade80; --bad:#f87171; --gold:#f2c94c; --f:"Space Grotesk",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(1000px 500px at 50% -10%,rgba(255,107,107,.10),transparent 60%),var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  button,input,select{font-family:inherit}
  header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
  .bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:700;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
  .brand span{color:var(--acc2)}
  .who{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:26px;max-width:1360px;margin:0 auto;padding:18px 20px 60px;align-items:start}
  main{min-width:0}
  /* teacher sidebar: Games · Sets · My Classes · School · Account */
  .snav{position:sticky;top:70px;display:flex;flex-direction:column;gap:2px;background:var(--p1);border:1px solid var(--edge);border-radius:18px;padding:12px}
  .snav .nh{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);padding:12px 10px 4px}
  .snav .nh:first-child{padding-top:4px}
  .snav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--dim);text-decoration:none;font-weight:600;font-size:15px}
  .snav a.sub{padding-left:16px}
  .snav a:hover{background:var(--p2);color:var(--ink)}
  .snav a.on{background:rgba(255,107,107,.14);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
  .snav a .i{width:22px;text-align:center}
  .snav .top{margin-top:8px}
  .snav .foot{margin-top:12px;padding:12px 10px 2px;border-top:1px solid var(--edge);font-size:13px;color:var(--mute);line-height:1.45}
  .snav .foot b{color:var(--ink);display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .snav .foot .btn{display:block;text-align:center;text-decoration:none;margin-top:8px}
  .ph{margin:0 0 18px} .ph h1{font-size:30px} .ph .sub{margin:4px 0 0;max-width:760px}
  .gsec{margin:0 0 26px} .gsec h2{font-size:18px;margin:0 0 12px;color:var(--dim)}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .gc{display:flex;flex-direction:column;gap:8px;background:var(--p1);border:1px solid var(--edge);border-radius:16px;padding:16px}
  .gc .nm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px} .gc .nm span{font-size:28px}
  .gc p{margin:0;color:var(--dim);font-size:14px;line-height:1.45} .gc .meta{color:var(--mute);font-size:13px}
  .gc .btn{margin-top:auto;text-align:center;text-decoration:none;box-shadow:0 4px 0 #a33a3a;font-size:16px}
  .soon{max-width:760px} .soon ul{margin:6px 0 18px;padding-left:20px;color:var(--dim);line-height:1.8}
  .soon .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);background:rgba(242,201,76,.12);border-radius:999px;padding:4px 10px;margin-bottom:10px}
  .lane{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge)} .lane:first-child{border-top:0}
  .lane .nm{flex:0 0 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lane .bar2{flex:1}
  .lane.me .nm{color:var(--acc2);font-weight:700}
  .card{background:var(--p1);border:1px solid var(--edge);border-radius:18px;padding:22px}
  .narrow{max-width:460px;margin:40px auto}
  h1{margin:0 0 6px;font-size:28px}
  h2{margin:0 0 4px;font-size:22px}
  .sub{color:var(--dim);margin:0 0 18px;line-height:1.5}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
  input,select{width:100%;background:#0e1219;border:1px solid var(--edge);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--acc);color:#1a0b0b;white-space:nowrap}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--edge)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.4)}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .msg{min-height:20px;margin:10px 0 0;color:var(--dim);font-size:14px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
  .or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--edge)}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
  .side{display:flex;flex-direction:column;gap:6px}
  .side h3{margin:0 0 6px;font-size:12px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
  .cls{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--p1);border:1px solid var(--edge);cursor:pointer;text-decoration:none;color:var(--ink)}
  .cls.on{border-color:var(--acc);background:var(--p2)}
  .cls small{color:var(--mute)}
  .tabs{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
  .tab{padding:9px 14px;border-radius:999px;border:1px solid var(--edge);color:var(--dim);text-decoration:none;font-weight:600;font-size:14px}
  .tab.on{background:var(--ink);color:var(--bg);border-color:transparent}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--edge)}
  td{padding:10px;border-bottom:1px solid rgba(42,51,68,.6);vertical-align:top}
  tr.link{cursor:pointer} tr.link:hover td{background:rgba(255,255,255,.03)}
  .pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--p2);color:var(--dim)}
  .pill.owner{background:rgba(242,201,76,.15);color:var(--gold)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
  .stat{background:var(--p2);border:1px solid var(--edge);border-radius:14px;padding:12px 14px}
  .stat b{display:block;font-size:24px}
  .stat span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .bar2{height:8px;border-radius:8px;background:#0e1219;overflow:hidden;min-width:80px}
  .bar2 i{display:block;height:100%;border-radius:8px}
  .empty{color:var(--dim);text-align:center;padding:30px 10px}
  .back{color:var(--dim);text-decoration:none;font-size:14px}
  .muted{color:var(--mute);font-size:13px}
  .claim{border-color:rgba(255,107,107,.5);background:linear-gradient(rgba(255,107,107,.08),transparent)}
  @media (max-width:820px){ .layout{grid-template-columns:1fr} .hide-s{display:none} td,th{padding:8px 6px}
    .shell{grid-template-columns:1fr;gap:14px;padding:12px 12px 50px}
    .snav{position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;scrollbar-width:none}
    .snav .nh,.snav .foot{display:none} .snav a{white-space:nowrap;flex:0 0 auto} .snav a.sub,.snav .top{padding-left:12px;margin-top:0} }
body{padding-top:46px} .who-row{justify-content:flex-end;padding-bottom:0}
.viewing{background:#3a2a0b;border:1px solid #b9862a;color:#ffd98a;border-radius:999px;padding:4px 12px;font-size:13px;max-width:72vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewas .who-row{position:relative;z-index:5}
</style>
<script src="/assets/hub-frame.js" data-always defer></script>
<script src="/assets/castle.js"></script>
<script src="/assets/class-games.js"></script>
</head>
<body>
<div class="bar who-row"><div class="who" id="who"></div></div>
<div class="shell"><nav class="snav" id="nav" aria-label="Teacher menu"></nav><main id="app"><div class="empty">Loading…</div></main></div>

<script src="../config.js" onerror="window.CG_CONFIG={server:''}"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={ get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch{} } };
const apiBase=()=>{ const s=(window.CG_CONFIG&&CG_CONFIG.server)||""; return s?s.replace(/^ws/,"http").replace(/\/$/,""):""; };
// Admin "view as teacher": the read-only token lives only in this tab (sessionStorage), never replacing your own sign-in
const VIEW={ get(){ try{ return sessionStorage.getItem("jgh_viewas"); }catch{ return null; } }, set(v){ try{ v?sessionStorage.setItem("jgh_viewas",v):sessionStorage.removeItem("jgh_viewas"); }catch{} } };
if (new URLSearchParams(location.search).get("viewas")) VIEW.set(new URLSearchParams(location.search).get("viewas"));
const authTok=()=>VIEW.get()||store.get("jgh_auth");
function exitView(){ VIEW.set(null); location.href="/admin/"; }
async function api(path,method="GET",body){
  const r=await fetch(apiBase()+path,{ method, headers:{ "content-type":"application/json", ...(authTok()?{ authorization:"Bearer "+authTok() }:{}) }, body:body?JSON.stringify(body):undefined });
  const j=await r.json().catch(()=>({}));
  if (r.status===401 && VIEW.get()){ VIEW.set(null); $("app").innerHTML=`<div class="empty">That view-as session has ended. <a href="/admin/">Back to admin</a></div>`; throw new Error("ended"); }
  if (r.status===401 && store.get("jgh_auth")){ store.set("jgh_auth",null); route(); }
  if (!r.ok){ const e=new Error(j.error||"Something went wrong."); e.status=r.status; throw e; }
  return j;
}
const GAMES={ math:"Math Race", arrows:"Arrow Blitz", rush:"Rush Hour", hurdle:"Hurdle Dash", hoops:"Mathsketball", munch:"Marble Munch", softball:"Softball Smarts", crossword:"Vocab Crossword", stumble:"Bumbling Stumbling Math", bear:"Bear Attack!", memory:"Memory Tiles", typing:"Typing Cowboys", cannons:"Star Cannons", darts:"Dart Party", sky:"Sky Climb", words:"Word Rush" };
const MODES={ add:"Addition", sub:"Subtraction", mul:"Multiplication", div:"Division", money:"Money" };
const gameName=(g,m)=>(GAMES[g]||g)+(m&&MODES[m]?` · ${MODES[m]}`:"");
const when=d=>new Date(d).toLocaleString(undefined,{ month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
const fullName=r=>`${r.first_name||r.first} ${r.last_initial||r.last?(r.last_initial||r.last)+".":""}`.trim();
const fmtTime=t=>t==null?"–":`${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}`;
// what each game's "score" means
function scoreText(g,r){
  const s=r.stats||{};
  if (g==="math") return `${r.score} correct`;
  if (g==="arrows") return `${r.score} pts`;
  if (g==="rush"||g==="hurdle") return s.finished?fmtTime(s.time)+(g==="hurdle"&&s.extra!=null?` · ${s.extra}/10 clean`:""):`${s.percent??0}% (didn't finish)`;
  if (g==="munch") return `🔮 ${s.marbles??0} marbles · ${s.right??0} right, ${(s.wrong??0)+(s.slow??0)} spat out`;
  if (g==="stumble") return s.finished?fmtTime(s.time)+(s.extra!=null?` · ${s.extra} falls`:""):`${s.percent??0}% of the course`;
  if (g==="crossword") return s.finished?fmtTime(s.time)+(s.extra?` · ${s.extra} hints`:""):`${s.percent??0}% of the words`;
  if (g==="softball") return s.finished?fmtTime(s.time)+(s.extra!=null?` · ${s.extra} home runs`:""):`${s.percent??0}% of the run goal`;
  if (g==="hoops") return s.finished?fmtTime(s.time)+(s.extra!=null?` · ${s.extra} shots`:""):`${s.percent??0}% of the basket goal`;
  if (g==="words") return `${s.words??0} of ${s.of??"?"} words · ${s.points??r.score} pts`;
  if (g==="sky") return s.finished?fmtTime(s.time):`${s.percent??0}% of the way up`;
  if (g==="darts") return `${s.points??r.score} pts · ${s.pops??0} balloons`+(s.won?" · 🏆 reached the goal":"");
  if (g==="cannons") return `${s.points??r.score} pts · ${s.seconds}s`;
  if (g==="typing") return s.finished?fmtTime(s.time)+(s.extra!=null?` · ${s.extra} missed`:""):`${s.percent??0}% (didn't finish)`;
  if (g==="bear") return s.stillOn?"🏆 last on the ice":`${s.seconds}s on the ice · ${s.rounds} rounds`;
  if (g==="memory") return s.stillIn?"🏆 last one in":`${s.rounds} rounds survived`;
  return r.score??"";
}

// ============================================================
//  BOOT: handle ?login= · ?invite= · ?claim= then route
// ============================================================
const params=new URLSearchParams(location.search);
const flow={ invite:params.get("invite"), claim:params.get("claim") };
if (flow.invite) store.set("jgh_invite",flow.invite);
if (flow.claim) store.set("jgh_claim",flow.claim);
let ME=null, CFG={};
(async function boot(){
  try{ CFG=await api("/api/config"); }catch{ CFG={}; }
  const login=params.get("login");
  if (login){
    try{ const r=await api("/api/auth/email/verify","POST",{ token:login }); store.set("jgh_auth",r.token); }
    catch(e){ history.replaceState(null,"",location.pathname); return renderSignIn(e.message); }
  }
  history.replaceState(null,"",location.pathname+location.hash);
  addEventListener("hashchange",route);
  route();
})();
// sidebar sections. Games + Explore sets work signed out (open a lobby without an account); the rest need a sign-in.
const SECTION={ games:"games", sets:"sets", classes:"classes", class:"classes", session:"classes", student:"classes", school:"school", account:"account" };
function renderNav(sec,sub){
  const L=(href,ico,txt,on,cls="")=>`<a href="#${href}" class="${cls} ${on?"on":""}"${on?' aria-current="page"':""}><span class="i">${ico}</span>${txt}</a>`;
  const t=ME&&ME.teacher;
  $("nav").innerHTML=`<div class="nh">Games</div>
    ${L("games/edu","📚","Educational",sec==="games"&&sub!=="fun","sub")}${L("games/fun","🎉","Just for fun",sec==="games"&&sub==="fun","sub")}
    <div class="nh">Sets</div>
    ${L("sets/mine","🗂️","My sets",sec==="sets"&&sub!=="explore","sub")}${L("sets/explore","🔎","Explore sets",sec==="sets"&&sub==="explore","sub")}
    ${L("classes","👥","My Classes",sec==="classes","top")}${L("school","🏫","School",sec==="school")}${L("account","👤","Account",sec==="account")}
    <div class="foot">${t?`Signed in as<b>${esc(t.displayName||t.email)}</b>`:`Sign in to save results, build sets and grow your castle.<a class="btn sm" href="#classes">Sign in</a>`}</div>`;
}
async function route(){
  const [kind,id,tab]=location.hash.slice(1).split("/");
  const sec=SECTION[kind]||"games";
  if (!authTok()){
    ME=null; renderNav(sec,id);
    if (sec==="games") return renderGames(id);
    if (sec==="sets"&&id==="explore") return renderSets("explore");
    return renderSignIn();
  }
  try{ ME=await api("/api/me"); }catch(e){ return; }
  document.body.classList.toggle("viewas",!!ME.viewAs);
  renderNav(sec,id);
  $("who").innerHTML=ME.viewAs
    ?`<span class="viewing">👁 Viewing as <b>${esc(ME.teacher.displayName||ME.teacher.email)}</b> · ${esc(ME.teacher.email)} · view only</span><a href="#" id="exitView">Exit</a>`:"";
  if (ME.viewAs) $("exitView").onclick=e=>{ e.preventDefault(); exitView(); };
  else if (!ME.teacher.google && (!ME.teacher.hasPassword || ME.teacher.mustChange)) return renderSetPassword();
  else if (!ME.teacher.displayName || !ME.teacher.schoolId) return renderSetup();
  if (!ME.viewAs){
  const inv=store.get("jgh_invite"); if (inv) return acceptInvite(inv);
  const claim=store.get("jgh_claim"); if (claim) return renderClaim(claim);
  }
  if (kind==="session") return renderSession(id);
  if (kind==="student") return renderStudent(id);
  if (sec==="account") return renderAccount();
  if (sec==="school") return renderSchool();
  if (sec==="sets") return renderSets(id==="explore"?"explore":"mine");
  if (sec==="classes") return renderClasses(kind==="class"?+id:null,tab||"games");
  return renderGames(id);
}

// ============================================================
//  GAMES: Educational (Math · Vocabulary · Typing) · Just for fun
// ============================================================
function renderGames(sub){
  const fun=sub==="fun", groups=(window.CLASS_GROUPS||[]).filter(g=>g.edu===!fun);
  const card=id=>{ const c=(window.CLASS_GAMES||[]).find(x=>x.id===id); if (!c) return "";
    return `<div class="gc"><div class="nm"><span>${c.ico}</span>${esc(c.name)}</div><p>${esc(c.skill)}</p>
      <div class="meta">⏱ ${esc(c.len)} · ${esc(c.view)}</div><a class="btn" href="${c.path}?play=teacher">Open a Lobby</a></div>`; };
  $("app").innerHTML=`<div class="ph"><h1>${fun?"🎉 Just for fun":"📚 Educational games"}</h1>
      <p class="sub">${fun?"Brain breaks for the whole class: quick, silly and great for re-energising the room.":"Press <b>Open a Lobby</b>, put the 4-letter code on your board, and press Start when everyone's in. You don't play, so the leaderboard is all about your students."}</p></div>
    ${groups.map(g=>`<section class="gsec">${fun?"":`<h2>${esc(g.label)}</h2>`}<div class="ggrid">${g.ids.map(card).join("")}</div></section>`).join("")}
    ${ME?"":`<p class="muted"><a href="#classes">Sign in</a> to save every game to a class and see each student's progress. No account is needed just to play.</p>`}`;
}

// ============================================================
//  SETS: My sets · Explore sets (question sets that work in any game; being designed)
// ============================================================
function renderSets(which){
  const mine=which!=="explore";
  $("app").innerHTML=`<div class="ph"><h1>${mine?"🗂️ My sets":"🔎 Explore sets"}</h1>
      <p class="sub">${mine?"Your own questions and vocabulary, ready to play in any game.":"Ready-made sets from us and other teachers, by grade and subject."}</p></div>
    <div class="card soon"><span class="tag">Coming soon</span>
      ${mine?`<h2>Bring your own lesson</h2><p class="sub">Build a set once and play it in any game that fits.</p>
        <ul><li>Paste a word list or Q&amp;A, or upload a spreadsheet</li><li>Number answers, multiple choice, and term → definition</li><li>Share a set with colleagues at your school</li></ul>
        <button class="btn" disabled>＋ New set</button>`
      :`<h2>Starter sets for every class</h2><p class="sub">Search ready-made sets, copy one into My sets, and change anything you like.</p>
        <ul><li>Math facts, sight words, vocabulary and more</li><li>Filter by grade, subject and standard</li><li>Sets shared by teachers at your school</li></ul>`}</div>`;
}

// ============================================================
//  SCHOOL: your castle, where it stands at your school, and the live tournament
// ============================================================
async function renderSchool(){
  const t=ME.teacher, sid=t.schoolId;
  $("app").innerHTML=`<div class="ph"><h1>🏫 School</h1><p class="sub">Every class game you save adds bricks to your castle: an average result ≈ 100 bricks per student, in any game.</p></div>
    <div class="layout"><div>${Castle.card({ name:t.displayName||"Your", bricks:ME.castle?ME.castle.bricks:0, games:ME.castle?ME.castle.games:0, mine:true })}</div><div id="sch"><div class="card empty">Loading…</div></div></div>`;
  if (!sid){ $("sch").innerHTML=`<div class="card"><p class="sub">Pick your school in <a href="#account">Account</a> to see the castles there.</p></div>`; return; }
  let d; try{ const r=await fetch(apiBase()+"/api/school/"+encodeURIComponent(sid)); d=await r.json(); if (!r.ok) throw new Error(d.error); }
  catch{ $("sch").innerHTML=`<div class="card empty">Couldn't load your school right now.</div>`; return; }
  const myName=t.displayName||"", rank=d.castles.findIndex(c=>c.name===myName)+1, T=d.tournament, fmt=n=>Number(n||0).toLocaleString();
  $("sch").innerHTML=`<div class="card"><h2>${esc(d.school.name)}</h2>
      <p class="sub">${d.castles.length} teacher castle${d.castles.length===1?"":"s"}${rank?` · yours is <b style="color:var(--ink)">#${rank}</b>`:""}</p>
      ${T?`<label>⚔️ Live tournament · ${esc(T.name)} · first to 🧱 ${fmt(T.goal)}</label>
        ${T.standings.slice(0,5).map(s=>`<div class="lane ${s.name===myName?"me":""}"><span class="nm">${esc(s.name)}</span><div class="bar2"><i style="width:${Math.min(100,s.bricks/T.goal*100).toFixed(1)}%;background:var(--gold)"></i></div><span class="muted">${fmt(s.bricks)}</span></div>`).join("")}`
      :`<p class="muted">No tournament running right now.</p>`}

// three tabs: Sign in (email + password) · Create account · Forgot password (recovery question, no email).
// Older accounts without a password: "No password yet?" signs in the old way once, then they must set one.
const qOptions=sel=>Object.entries(CFG.questions||{}).map(([k,t])=>`<option value="${esc(k)}" ${sel===k?"selected":""}>${esc(t)}</option>`).join("");
function renderSignIn(error,tab="in"){
  $("who").innerHTML="";
  const why=store.get("jgh_claim")?"Create your free account (or sign in) to keep the results from the game you just ran."
    :store.get("jgh_invite")?"Sign in with the email address the invite was sent to.":"Save every Teacher Mode game, see each student's progress, and share classes with co-teachers.";
  const tabs=[["in","Sign in"],["new","Create account"],["forgot","Forgot password"]];
  $("app").innerHTML=`<div class="card narrow">
    <h1>🍎 Teachers</h1><p class="sub">${why}</p>
    <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<a href="#" class="tab ${k===tab?"on":""}" data-tab="${k}" role="tab" aria-selected="${k===tab}">${t}</a>`).join("")}</div>
    <div id="gbtn"></div>${CFG.googleClientId&&tab!=="forgot"?`<div class="or">or use your email</div>`:""}
    <div id="form"></div>
    <p class="msg ${error?"err":""}" id="msg">${esc(error||"")}</p>
    <p class="muted" style="margin:14px 0 0">Students never need an account. They just type a first name, last initial and nickname when they join your game.</p></div>`;
  document.querySelectorAll("[data-tab]").forEach(a=>a.onclick=e=>{ e.preventDefault(); renderSignIn("",a.dataset.tab); });
  const msg=(t,cls="err")=>{ $("msg").className="msg "+cls; $("msg").textContent=t; };
  const signedIn=r=>{ store.set("jgh_auth",r.token); route(); };
  const busy=async(btn,fn)=>{ btn.disabled=true; msg("…","msg"); try{ await fn(); }catch(e){ msg(e.message); } btn.disabled=false; };
  const enter=(ids,btn)=>ids.forEach(id=>$(id)&&$(id).addEventListener("keydown",e=>{ if (e.key==="Enter") $(btn).click(); }));
  if (tab==="in"){
    $("form").innerHTML=`<label for="email">School email</label><input id="email" type="email" autocomplete="username" placeholder="you@school.org">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="go" style="width:100%;margin-top:14px">Sign in</button>
      <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">No password yet? (accounts made before passwords)</summary>
        <p class="muted">Sign in the old way once, then you'll be asked to choose a password and a recovery question.</p>
        <button class="btn ghost" id="old" style="width:100%">${CFG.noVerify?"Sign in with just my email":"Email me a sign-in link"}</button></details>`;
    $("go").onclick=()=>busy($("go"),async()=>{ const email=$("email").value.trim(), password=$("pw").value; if (!email||!password) throw new Error("Type your email and password.");
      signedIn(await api("/api/auth/password","POST",{ email, password })); });
    $("old").onclick=()=>busy($("old"),async()=>{ const email=$("email").value.trim(); if (!email) throw new Error("Type your email first.");
      const r=await api("/api/auth/email","POST",{ email });
      if (r.token) return signedIn(r);
      if (r.devLink){ $("msg").className="msg ok"; $("msg").innerHTML=`Dev mode: <a href="${esc(r.devLink)}">click here to sign in</a>`; }
      else msg(r.delivered?"Check your inbox for a sign-in link (it works for 15 minutes).":"Sign-in emails aren't set up yet on this server. Ask the site owner.","ok"); });
    enter(["email","pw"],"go");
  } else if (tab==="new"){
    $("form").innerHTML=`<label for="email">School email</label><input id="email" type="email" autocomplete="username" placeholder="you@school.org">
      <label for="nm">Your name (as students know you)</label><input id="nm" maxlength="60" placeholder="e.g. Ms. Price">
      ${pwFields(true)}
      <button class="btn" id="go" style="width:100%;margin-top:14px">Create account</button>`;
    $("go").onclick=()=>busy($("go"),async()=>{ const v=pwValues(true); signedIn(await api("/api/auth/register","POST",{ email:$("email").value.trim(), displayName:$("nm").value.trim(), ...v })); });
  } else {
    $("form").innerHTML=`<p class="sub" style="margin:0">Answer your recovery question to choose a new password. No email needed.</p>
      <label for="email">School email</label><div class="row"><input id="email" type="email" autocomplete="username" placeholder="you@school.org" style="flex:1"><button class="btn ghost" id="ask">Next</button></div>
      <div id="step2"></div>`;
    $("ask").onclick=()=>busy($("ask"),async()=>{ const q=await api("/api/auth/recover/question","POST",{ email:$("email").value.trim() }); msg("","msg");
      $("step2").innerHTML=`<label for="ans">${esc(q.text)}</label><input id="ans" autocomplete="off">
        <label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <label for="pw2">New password again</label><input id="pw2" type="password" autocomplete="new-password">
        <button class="btn" id="go" style="width:100%;margin-top:14px">Reset password and sign in</button>`;
      $("ans").focus();
      $("go").onclick=()=>busy($("go"),async()=>{ if ($("pw").value!==$("pw2").value) throw new Error("The two passwords don't match.");
        signedIn(await api("/api/auth/recover","POST",{ email:$("email").value.trim(), answer:$("ans").value, password:$("pw").value })); });
      enter(["ans","pw","pw2"],"go"); });
    enter(["email"],"ask");
  }
  if (CFG.googleClientId && tab!=="forgot"){
    const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true;
    s.onload=()=>{ google.accounts.id.initialize({ client_id:CFG.googleClientId, callback:async resp=>{
        try{ signedIn(await api("/api/auth/google","POST",{ credential:resp.credential })); }
        catch(e){ msg(e.message); } } });
      google.accounts.id.renderButton($("gbtn"),{ theme:"filled_black", size:"large", width:400, text:"continue_with", shape:"pill" }); };
    document.head.appendChild(s);
  }
}
// shared password + recovery-question fields
function pwFields(withQ,cur){
  return `${cur?`<label for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password">`:""}
    <label for="pw">${cur?"New password":"Password"}</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    <label for="pw2">${cur?"New password":"Password"} again</label><input id="pw2" type="password" autocomplete="new-password">
    ${withQ?`<label for="rq">Recovery question (to reset your password without email)</label><select id="rq"><option value="">Pick a question…</option>${qOptions(ME&&ME.teacher&&ME.teacher.recoveryQ)}</select>
    <label for="ra">Your answer</label><input id="ra" autocomplete="off" placeholder="Not case sensitive">`:""}`;
}
function pwValues(withQ){
  if ($("pw").value!==$("pw2").value) throw new Error("The two passwords don't match.");
  if ($("pw").value.length<8) throw new Error("Passwords need at least 8 characters.");
  const v={ password:$("pw").value }; if ($("cur")) v.current=$("cur").value;
  const keepQ=ME&&ME.teacher&&ME.teacher.recoveryQ&&$("rq")&&$("rq").value===ME.teacher.recoveryQ&&!$("ra").value.trim();   // only the password is changing
  if (withQ && !keepQ){ if (!$("rq").value) throw new Error("Please pick a recovery question."); if (!$("ra").value.trim()) throw new Error("Please answer your recovery question."); v.question=$("rq").value; v.answer=$("ra").value; }
  return v;
}
// older accounts (no password) and admin-issued temporary passwords: choose a password before anything else
function renderSetPassword(){
  const temp=ME.teacher.mustChange;
  $("app").innerHTML=`<div class="card narrow"><h1>🔒 ${temp?"Choose a new password":"Protect your account"}</h1>
    <p class="sub">${temp?"You signed in with a temporary password. Please choose your own.":"Teacher accounts now have passwords. Choose one, plus a recovery question so you can reset it without email."}</p>
    ${pwFields(!temp||!ME.teacher.recoveryQ)}
    <button class="btn" id="go" style="width:100%;margin-top:14px">Save and continue</button><p class="msg err" id="msg"></p></div>`;
  $("go").onclick=async()=>{ $("go").disabled=true;
    try{ await api("/api/me/password","POST",pwValues(!temp||!ME.teacher.recoveryQ)); route(); }catch(e){ $("msg").textContent=e.message; }
    $("go").disabled=false; };
}

// ============================================================
//  ONE GAME: full results (teacher-only, so everyone is listed) + most-missed questions
// ============================================================
async function renderSession(id){
  const { session:s, results }=await api("/api/sessions/"+id);
  const logs=results.flatMap(r=>(r.log||[]).map(x=>({ ...x, who:fullName(r) })));
  const qs=new Map(); for (const l of logs){ if (!l.q) continue; const k=l.q; const e=qs.get(k)||{ q:k, a:l.a, n:0, wrong:0, ms:0 }; e.n++; if (!l.ok) e.wrong++; e.ms+=l.ms||0; qs.set(k,e); }
  const missed=[...qs.values()].filter(e=>e.wrong).sort((a,b)=>b.wrong/b.n-a.wrong/a.n||b.wrong-a.wrong).slice(0,10);
  const answered=logs.length, right=logs.filter(l=>l.ok).length;
  $("app").innerHTML=`<a class="back" href="#class/${s.class_id}/games">← Back to class</a>
    <div class="card" style="margin-top:10px"><h2>${esc(gameName(s.game,s.mode))}</h2><p class="sub">${when(s.ended_at)} · ${results.length} students${s.room_code?` · room ${esc(s.room_code)}`:""}</p>
    ${answered?`<div class="stats"><div class="stat"><span>Questions answered</span><b>${answered}</b></div><div class="stat"><span>Class accuracy</span><b>${Math.round(100*right/answered)}%</b></div>
      <div class="stat"><span>Avg. answer time</span><b>${(logs.reduce((a,l)=>a+(l.ms||0),0)/answered/1000).toFixed(1)}s</b></div></div>`:""}
    <table><tr><th>#</th><th>Student</th><th class="hide-s">Nickname</th><th>Result</th>${answered?`<th class="hide-s">Accuracy</th>`:""}</tr>
    ${results.map(r=>{ const lg=r.log||[], ok=lg.filter(l=>l.ok).length;
      return `<tr class="link" data-st="${r.student_id}"><td>${r.place??""}</td><td><b>${esc(fullName(r))}</b></td><td class="hide-s muted">${esc(r.nickname)}</td><td>${esc(scoreText(s.game,r))}</td>
        ${answered?`<td class="hide-s">${lg.length?`${Math.round(100*ok/lg.length)}% <span class="muted">(${ok}/${lg.length})</span>`:"–"}</td>`:""}</tr>`; }).join("")}</table>
    ${missed.length?`<h2 style="margin-top:24px;font-size:18px">Most-missed questions</h2><p class="sub" style="margin-bottom:8px">Worth a quick review with the class.</p>
      <table><tr><th>Question</th><th>Answer</th><th>Missed</th><th></th></tr>${missed.map(m=>`<tr><td><b>${esc(m.q)}</b></td><td>${esc(m.a)}</td><td>${m.wrong} of ${m.n}</td>
        <td style="width:30%"><div class="bar2"><i style="width:${100*m.wrong/m.n}%;background:var(--bad)"></i></div></td></tr>`).join("")}</table>`:""}
    <div class="row" style="margin-top:20px"><button class="btn ghost" id="csv">Download CSV</button><button class="btn danger" id="del">Delete this game</button></div></div>`;
  $("app").querySelectorAll("tr[data-st]").forEach(tr=>tr.onclick=()=>location.hash=`#student/${tr.dataset.st}`);
  $("csv").onclick=()=>download(`${GAMES[s.game]||s.game} ${new Date(s.ended_at).toISOString().slice(0,10)}.csv`,
    [["Place","First name","Last initial","Nickname","Result",...(answered?["Correct","Answered"]:[])],...results.map(r=>{ const lg=r.log||[];
      return [r.place??"",r.first_name,r.last_initial,r.nickname,scoreText(s.game,r),...(answered?[lg.filter(l=>l.ok).length,lg.length]:[])]; })]);
  $("del").onclick=async()=>{ if (!confirm("Delete this game's results permanently?")) return; try{ await api("/api/sessions/"+id,"DELETE"); location.hash=`#class/${s.class_id}/games`; }catch(e){ alert(e.message); } };
}
function download(name,rows){
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{ type:"text/csv" })); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

// ============================================================
//  ONE STUDENT: history across games
// ============================================================
async function renderStudent(id){
  const { student:st, history }=await api("/api/students/"+id);
  const logs=history.flatMap(h=>h.log||[]), ok=logs.filter(l=>l.ok).length;
  $("app").innerHTML=`<a class="back" href="#class/${st.classId}/students">← Back to students</a>
    <div class="card" style="margin-top:10px"><h2>${esc(st.first)} ${esc(st.last?st.last+".":"")}</h2><p class="sub">Plays as <b style="color:var(--ink)">${esc(st.nick)}</b> · ${history.length} game${history.length===1?"":"s"}</p>
    <div class="stats"><div class="stat"><span>Games played</span><b>${history.length}</b></div>
      ${history.length?`<div class="stat"><span>Avg. place</span><b>${(history.reduce((a,h)=>a+(h.place||0),0)/history.length).toFixed(1)}</b></div>`:""}
      ${logs.length?`<div class="stat"><span>Question accuracy</span><b>${Math.round(100*ok/logs.length)}%</b></div><div class="stat"><span>Questions answered</span><b>${logs.length}</b></div>`:""}</div>
    ${history.length?`<table><tr><th>When</th><th>Game</th><th>Place</th><th>Result</th></tr>${history.map(h=>`<tr class="link" data-s="${h.session_id}"><td>${when(h.ended_at)}</td><td>${esc(gameName(h.game,h.mode))}</td><td>${h.place??"–"} <span class="muted">of ${h.player_count}</span></td><td>${esc(scoreText(h.game,h))}</td></tr>`).join("")}</table>`:`<div class="empty">No games yet.</div>`}
    <h2 style="margin-top:24px;font-size:18px">Fix this student</h2>
    <div class="row" style="flex-wrap:nowrap"><input id="f1" maxlength="20" value="${esc(st.first)}" aria-label="First name"><input id="f2" maxlength="1" value="${esc(st.last)}" style="width:70px" aria-label="Last initial"><input id="f3" maxlength="14" value="${esc(st.nick)}" aria-label="Nickname"><button class="btn" id="fix">Save</button></div>
    <div class="row" style="margin-top:14px"><button class="btn danger" id="del">Remove student and their results</button></div><p class="msg err" id="msg"></p></div>`;
  $("app").querySelectorAll("tr[data-s]").forEach(tr=>tr.onclick=()=>location.hash=`#session/${tr.dataset.s}`);
  $("fix").onclick=async()=>{ try{ await api("/api/students/"+id,"PATCH",{ first:$("f1").value, last:$("f2").value, nick:$("f3").value }); renderStudent(id); }catch(e){ $("msg").textContent=e.message; } };
  $("del").onclick=async()=>{ if (!confirm("Remove this student and all of their saved results?")) return; try{ await api("/api/students/"+id,"DELETE"); location.hash=`#class/${st.classId}/students`; }catch(e){ $("msg").textContent=e.message; } };
}

// ============================================================
//  ACCOUNT
// ============================================================
async function renderAccount(){
  const { schools }=await api("/api/schools"); const sc=schools.find(s=>s.id===ME.teacher.schoolId);
  $("app").innerHTML=`<div class="card narrow" style="margin-top:10px"><h2>Your account</h2>
    <p class="sub">${esc(ME.teacher.displayName)} · ${esc(ME.teacher.email)}${sc?`<br>${esc(sc.name)}, ${esc(sc.state)}`:""}</p>
    <div class="row"><button class="btn ghost" id="edit">Change name or school</button><button class="btn ghost" id="out">Sign out</button></div>
    <label style="margin-top:24px">Password &amp; recovery question</label>
    <p class="sub" style="margin-bottom:6px">${ME.teacher.hasPassword?"Recovery question: "+esc(ME.teacher.recoveryText||"not set"):"No password yet."} Changing your password signs you out on every other device.</p>
    <details><summary class="btn ghost" style="display:inline-block">Change password or question</summary><div style="margin-top:6px">${pwFields(true,ME.teacher.hasPassword)}
      <button class="btn" id="pwSave" style="margin-top:12px">Save</button><p class="msg" id="pwMsg"></p></div></details>
    <label style="margin-top:24px">Delete account</label><p class="sub" style="margin-bottom:10px">Deletes your account, every class you own, their students and all saved games. Classes shared with you are not affected.</p>
    <button class="btn danger" id="del">Delete my account</button></div>`;
  $("edit").onclick=()=>{ ME.teacher.schoolId=null; renderSetup(); };
  $("pwSave").onclick=async()=>{ const m=$("pwMsg"); try{ await api("/api/me/password","POST",pwValues(true)); m.className="msg ok"; m.textContent="Saved. Other devices have been signed out."; }catch(e){ m.className="msg err"; m.textContent=e.message; } };
  $("out").onclick=async()=>{ try{ await api("/api/auth/logout","POST"); }catch{} store.set("jgh_auth",null); location.hash=""; route(); };
  $("del").onclick=async()=>{ if (prompt("Type DELETE to permanently delete your account and all your classes:")!=="DELETE") return; await api("/api/me","DELETE"); store.set("jgh_auth",null); location.hash=""; route(); };
}
</script>

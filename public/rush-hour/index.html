<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rush Hour · Joshua Game Hub</title>
<meta name="theme-color" content="#7ec8f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#152033; --ink2:#55657d; --card:#fff; --line:#e4ebf4; --go:#ff7a1a; --go2:#d65a00; --sun:#ffd23f; --sky:#7ec8f2; --ok:#22c55e;
    --h:"Russo One",system-ui,sans-serif; --b:"Nunito",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#7ec8f2;color:var(--ink);font-family:var(--b);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
  button,input{font-family:inherit}
  #view{position:fixed;inset:0;display:block;width:100%;height:100%}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;z-index:5;
    background:radial-gradient(ellipse at 50% 120%,rgba(21,32,51,.15),transparent 60%)}
  .screen.on{display:flex}
  .card{width:100%;max-width:540px;background:var(--card);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;position:relative;
    box-shadow:0 8px 0 rgba(21,32,51,.12),0 30px 70px -20px rgba(21,32,51,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
  .logo{margin:0;font-family:var(--h);font-weight:400;font-size:56px;line-height:.95;text-align:center;letter-spacing:1px;font-style:italic;
    background:linear-gradient(180deg,#ffb347,#ff7a1a 55%,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #b34700)}
  .logo small{display:block;font-size:.34em;letter-spacing:6px;-webkit-text-fill-color:var(--ink2);color:var(--ink2);filter:none;margin-top:6px;font-style:normal}
  .lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2)}
  input.f{width:100%;border:3px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;color:var(--ink);outline:none;background:#f7fafd}
  input.f:focus{border-color:var(--go)}
  .btn{appearance:none;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:900;cursor:pointer;color:#fff;background:var(--go);
    box-shadow:0 5px 0 var(--go2);transition:transform .08s,box-shadow .08s,filter .15s;letter-spacing:.3px}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--go2)}
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d5dfeb;border:3px solid #d5dfeb}
  .btn.dark{background:var(--ink);box-shadow:0 5px 0 #000}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
  .err{min-height:1.2em;margin:0;color:#e5484d;text-align:center;font-weight:700}
  .keys{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:14px;font-weight:700}
  kbd{display:inline-block;min-width:26px;padding:3px 7px;border-radius:7px;background:#eef3f9;border:2px solid #d5dfeb;border-bottom-width:4px;font-family:var(--b);font-weight:900;text-align:center;color:var(--ink)}
  a.back{position:absolute;top:16px;left:20px;color:var(--ink2);font-weight:800;text-decoration:none;font-size:14px}
  a.back:hover{color:var(--go)}
  /* lobby */
  .code{font-family:var(--h);font-size:50px;letter-spacing:10px;text-align:center;color:var(--ink);line-height:1}
  .count{text-align:center;color:var(--ink2);font-weight:800}
  .grid{display:flex;flex-wrap:wrap;gap:7px;max-height:36vh;overflow:auto}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;background:#f2f6fb;font-weight:800;font-size:14px}
  .chip i{width:16px;height:16px;border-radius:5px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
  .chip.me{box-shadow:inset 0 0 0 3px var(--go)}
  .chip.away{opacity:.45}
  .note{text-align:center;color:var(--ink2);margin:0;font-weight:700}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
  #hud.on{display:block}
  .hbox{position:absolute;background:rgba(255,255,255,.92);border-radius:16px;box-shadow:0 4px 0 rgba(21,32,51,.15);padding:8px 14px}
  #place{top:12px;left:12px;font-family:var(--h);font-size:34px;line-height:1;display:flex;align-items:baseline;gap:6px}
  #place small{font-family:var(--b);font-size:14px;font-weight:800;color:var(--ink2)}
  #clock{top:12px;right:50px;font-family:var(--h);font-size:24px;font-variant-numeric:tabular-nums}
  #track{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(46vw,520px);height:22px}
  #track .rail{position:absolute;left:0;right:22px;top:8px;height:6px;border-radius:6px;background:rgba(21,32,51,.25)}
  #track .flag{position:absolute;right:0;top:-2px;width:20px;height:24px;border-radius:3px;
    background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/10px 10px;box-shadow:0 0 0 2px #fff}
  #track .dot{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #fff;opacity:.85}
  #track .dot.me{width:20px;height:20px;top:1px;margin-left:-10px;opacity:1;z-index:2;box-shadow:0 0 0 3px var(--ink)}
  #speed{right:12px;bottom:12px;text-align:right;font-family:var(--h);font-size:30px;line-height:1}
  #speed small{display:block;font-family:var(--b);font-size:12px;font-weight:900;color:var(--ink2);letter-spacing:1px}
  #msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--h);font-size:min(16vw,120px);color:#fff;font-style:italic;
    text-shadow:0 6px 0 rgba(21,32,51,.4),0 0 30px rgba(255,122,26,.6);opacity:0;white-space:nowrap}
  #msg.show{animation:msg 1s ease-out forwards}
  @keyframes msg{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
  #pop{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:var(--h);font-size:34px;font-style:italic;color:#fff;opacity:0;white-space:nowrap}
  #pop.show{animation:popw .7s ease-out forwards}
  @keyframes popw{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
  #boostGlow{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(80,220,255,.65);opacity:0;transition:opacity .2s}
  #hitFlash{position:absolute;inset:0;background:rgba(255,80,80,.25);opacity:0;transition:opacity .25s}
  #done{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:auto}
  #done.on{display:block;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
  #done .card{gap:6px;align-items:center;padding:22px 30px}
  #done h2{margin:0;font-family:var(--h);font-size:40px;font-style:italic;color:var(--go)}
  #done p{margin:0;color:var(--ink2);font-weight:800}
  #done b{font-family:var(--h);font-size:26px}
  .pad{position:absolute;bottom:14px;left:0;right:0;display:none;justify-content:center;gap:12px;pointer-events:auto}
  body.touch .pad{display:flex}
  .pad button{width:min(26vw,110px);height:76px;border-radius:20px;border:0;background:rgba(255,255,255,.88);box-shadow:0 5px 0 rgba(21,32,51,.2);font-size:30px;font-weight:900;color:var(--ink);touch-action:none}
  .pad button.on{background:var(--go);color:#fff;transform:translateY(3px);box-shadow:0 2px 0 var(--go2)}
  body.touch #speed{bottom:104px}

  /* results */
  #results .card{max-width:600px;text-align:center}
  .champ{display:flex;flex-direction:column;align-items:center;gap:2px}
  .champ svg{width:90px;height:90px;filter:drop-shadow(0 8px 10px rgba(255,122,26,.35))}
  .champ .t{font-weight:900;letter-spacing:3px;color:var(--go);text-transform:uppercase;font-size:14px}
  .champ h2{margin:0;font-family:var(--h);font-size:38px;line-height:1.05}
  .board{display:flex;flex-direction:column;gap:7px;text-align:left}
  .line{display:grid;grid-template-columns:40px 18px 1fr auto auto;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#f2f6fb;font-weight:800;
    animation:pop .4s cubic-bezier(.2,1.4,.4,1) backwards}
  .line .pos{font-family:var(--h);font-size:20px;color:var(--ink2)}
  .line i{width:18px;height:18px;border-radius:5px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
  .line .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .tm{font-family:var(--h);font-size:18px;font-variant-numeric:tabular-nums}
  .line .gap{color:var(--ink2);font-size:13px;min-width:52px;text-align:right}
  .line.p1{background:#fff4d6;box-shadow:inset 0 0 0 3px var(--sun)}
  .line.p1 .pos{color:#c58a00}
  .line.me{box-shadow:inset 0 0 0 3px var(--go)}
  .you{display:flex;justify-content:space-between;font-weight:800;color:var(--ink2);padding:0 6px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
  #exitBtn{position:fixed;top:12px;right:12px;z-index:9;width:28px;height:28px;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;border:0;
    color:var(--ink2);box-shadow:0 3px 0 rgba(21,32,51,.2);cursor:pointer}
  #exitBtn:hover,#exitBtn:focus-visible{color:#e5484d;outline:none}
  @media (max-width:620px){ .logo{font-size:44px} .card{padding:22px} #place{font-size:26px} #clock{font-size:18px} #track{top:62px;width:calc(100vw - 40px)} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="/assets/hub-frame.js" defer></script>
</head>
<body>
<canvas id="view"></canvas>
<button id="exitBtn" type="button" title="Back to game hub" aria-label="Back to game hub"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

<div id="hud">
  <div class="hbox" id="place">–<small>/ –</small></div>
  <div id="track"><div class="rail"></div><div class="flag"></div><div id="dots"></div></div>
  <div class="hbox" id="clock">0:00.0</div>
  <div class="hbox" id="speed">0<small>KM/H</small></div>
  <div id="boostGlow"></div><div id="hitFlash"></div>
  <div id="msg"></div><div id="pop"></div>
  <div id="done"><div class="card"><h2 id="dTitle">FINISHED!</h2><b id="dTime">0:00.0</b><p id="dNote">Waiting for the others…</p></div></div>
  <div class="pad"><button data-k="left" aria-label="Left lane">◀</button><button data-k="brake" aria-label="Brake">▼</button><button data-k="right" aria-label="Right lane">▶</button></div>
</div>

<!-- MENU -->
<section class="screen on" id="menu"><div class="card">
  <h1 class="logo">RUSH HOUR<small>WEAVE · BOOST · WIN</small></h1>
  <div class="keys"><span><kbd>◀</kbd> <kbd>▶</kbd> change lane</span><span><kbd>▼</kbd> brake</span><span>Hit the <b style="color:#0ea5e9">glowing strips</b> to boost!</span></div>
  <div><div class="lbl" style="margin-bottom:6px">Your name</div><input class="f" id="nameIn" maxlength="14" placeholder="Type a name" autocomplete="off"></div>
  <div class="row"><button class="btn" id="bPublic">Race online</button><button class="btn dark" id="bPrivate">Private race</button></div>
  <div class="row"><input class="f" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center"><button class="btn alt" id="bJoin" style="flex:0 0 auto">Join</button></div>
  <button class="btn alt" id="bTeacher">🍎 Teacher mode · run a race for your class</button>
  <button class="btn alt" id="bSolo">Solo race vs ghost bots</button>
  <p class="err" id="err"></p>
</div></section>

<!-- LOBBY -->
<section class="screen" id="lobby"><div class="card">
  <div class="lbl" id="lKind" style="text-align:center">Private race</div>
  <div class="code" id="lCode">----</div>
  <div class="count" id="lCount">1 / 40 racers</div>
  <div class="grid" id="lGrid"></div>
  <p class="note" id="lNote"></p>
  <div class="row"><button class="btn" id="bStart">Start race!</button><button class="btn alt" id="bLeave" style="flex:0 0 auto">Leave</button></div>
</div></section>

<!-- RESULTS -->
<section class="screen" id="results"><div class="card">
  <div class="champ" id="champ"></div>
  <div class="board" id="rBoard"></div>
  <div class="you" id="rYou"></div>
  <div class="row"><button class="btn" id="bAgain">Back to lobby</button><a class="btn alt" href="../" style="text-align:center;text-decoration:none;flex:0 0 auto">Game hub</a></div>
</div></section>
<canvas id="confetti"></canvas>

<script src="../config.js" onerror="window.CG_CONFIG={server:''}"></script>
<script src="../assets/classkit.js"></script>
<script src="../rush.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const DEMO=/[?&]demo=1/.test(location.search);      // hub live preview: bots only, no input
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={ get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };
const { T }=RUSH;
const DT=1/60;
// racer colours never use red (red is reserved for the NPC cars): hues 35°–315°
const pcol=i=>`hsl(${35+(i*137.508)%280},80%,55%)`;
const fmt=t=>t==null?"–":`${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}`;
if (matchMedia("(pointer:coarse)").matches) document.body.classList.add("touch");

// ============================================================
//  3D WORLD (Three.js) — low-poly, built in code
// ============================================================
const renderer=new THREE.WebGLRenderer({ canvas:$("view"), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const SKY=0x9fd6f5;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,70,215);
const camera=new THREE.PerspectiveCamera(62,1,0.1,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x6aa84f,0.72));
const sun=new THREE.DirectionalLight(0xfff2d6,0.75); sun.position.set(-30,60,20); scene.add(sun);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<0.8?78:62; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();

const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({ color:c },o));
const BOX=new THREE.BoxGeometry(1,1,1), CYL=new THREE.CylinderGeometry(1,1,1,14);
function box(mat,w,h,l,x,y,z){ const m=new THREE.Mesh(BOX,mat); m.scale.set(w,h,l); m.position.set(x,y,z); return m; }
function wheel(mat,x,y,z,r=0.38){ const m=new THREE.Mesh(CYL,mat); m.scale.set(r,0.32,r); m.rotation.z=Math.PI/2; m.position.set(x,y,z); return m; }
const matTire=M(0x1d1f24), matGlass=M(0x223047), matLight=new THREE.MeshBasicMaterial({ color:0xfff6c2 }), matTail=new THREE.MeshBasicMaterial({ color:0xff3b3b });
const SHADOW=new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.22, depthWrite:false });
// all vehicles face -Z; origin at the vehicle centre on the road
function racer(color, ghost){
  const g=new THREE.Group(), body=M(color, ghost?{ transparent:true, opacity:0.34, depthWrite:false }:{});
  const glass=ghost?M(0xffffff,{ transparent:true, opacity:0.22, depthWrite:false }):matGlass;
  if (ghost){ body.userData.base=0.34; glass.userData.base=0.22; }
  g.add(box(body,1.9,0.55,4.2,0,0.58,0));
  g.add(box(body,1.6,0.5,2.0,0,1.08,0.25));
  g.add(box(glass,1.5,0.38,0.08,0,1.08,-0.78));
  if (!ghost){
    g.add(box(glass,1.62,0.34,1.6,0,1.1,0.28));
    g.add(box(body,1.95,0.12,0.4,0,1.0,1.95));                // spoiler
    for (const sx of [-0.95,0.95]) for (const sz of [-1.3,1.35]) g.add(wheel(matTire,sx,0.38,sz));
    g.add(box(matLight,0.4,0.16,0.06,-0.6,0.62,-2.1)); g.add(box(matLight,0.4,0.16,0.06,0.6,0.62,-2.1));
    g.add(box(matTail,0.42,0.14,0.06,-0.62,0.66,2.1)); g.add(box(matTail,0.42,0.14,0.06,0.62,0.66,2.1));
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(2.3,4.8),SHADOW); sh.rotation.x=-Math.PI/2; sh.position.y=0.02; g.add(sh);
  }
  return g;
}
const NPC_MODELS={
  car(){ const g=new THREE.Group(), b=M(0xe63946);
    g.add(box(b,1.9,0.6,4.5,0,0.6,0)); g.add(box(b,1.6,0.55,2.2,0,1.15,0.2)); g.add(box(matGlass,1.62,0.4,1.9,0,1.18,0.2));
    for (const sx of [-0.95,0.95]) for (const sz of [-1.4,1.45]) g.add(wheel(matTire,sx,0.38,sz));
    g.add(box(matTail,0.4,0.15,0.06,-0.62,0.7,2.26)); g.add(box(matTail,0.4,0.15,0.06,0.62,0.7,2.26)); return g; },
  truck(){ const g=new THREE.Group(), b=M(0x2563eb), cargo=M(0x3b82f6);
    g.add(box(b,2.2,1.5,2.2,0,1.2,-2.5)); g.add(box(matGlass,2.0,0.6,0.06,0,1.5,-3.62));
    g.add(box(cargo,2.3,2.3,5.2,0,1.6,1.1)); g.add(box(M(0x1e40af),2.32,0.25,5.22,0,0.5,1.1));
    for (const sx of [-1.05,1.05]) for (const sz of [-2.6,0.6,2.6]) g.add(wheel(matTire,sx,0.45,sz,0.45));
    g.add(box(matTail,0.3,0.2,0.06,-0.9,0.7,3.72)); g.add(box(matTail,0.3,0.2,0.06,0.9,0.7,3.72)); return g; },
  semi(){ const g=new THREE.Group(), w=M(0xf3f5f8), stripe=M(0x94a3b8), cab=M(0xe8ecf2);
    g.add(box(cab,2.4,2.2,3.0,0,1.6,-6.2)); g.add(box(matGlass,2.2,0.8,0.06,0,2.0,-7.72)); g.add(box(stripe,2.42,0.3,3.02,0,0.75,-6.2));
    g.add(box(w,2.5,2.9,11.6,0,2.05,1.6)); g.add(box(stripe,2.52,0.22,11.62,0,0.75,1.6));
    for (const sx of [-1.1,1.1]) for (const sz of [-6.6,-5.0,4.6,6.0]) g.add(wheel(matTire,sx,0.5,sz,0.5));
    g.add(box(matTail,0.3,0.2,0.06,-1.0,0.7,7.42)); g.add(box(matTail,0.3,0.2,0.06,1.0,0.7,7.42)); return g; },
};
for (const k of Object.keys(NPC_MODELS)){ const make=NPC_MODELS[k]; NPC_MODELS[k]=()=>{ const g=make(); const sh=new THREE.Mesh(new THREE.PlaneGeometry(k==="semi"?2.9:2.5,RUSH.NPC[k].len+0.6),SHADOW); sh.rotation.x=-Math.PI/2; sh.position.y=0.02; g.add(sh); return g; }; }
const npcPool={ car:[], truck:[], semi:[] };
function npcMesh(type){ const p=npcPool[type]; for (const m of p) if (!m.used){ m.used=true; m.visible=true; return m; } const m=NPC_MODELS[type](); m.used=true; scene.add(m); p.push(m); return m; }

// road + scenery in 60 m segments, recycled as you drive
const SEG=60, SEGS=6;
function canvasTex(w,h,draw,rep){ const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=8; if (rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); } return t; }
const ROADW=T.laneW*3+2.4;
const roadTex=canvasTex(256,512,(x,w,h)=>{ x.fillStyle="#3a3f4a"; x.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){ x.fillStyle=`rgba(255,255,255,${Math.random()*0.04})`; x.fillRect(Math.random()*w,Math.random()*h,2,2); }
  const lx=k=>w*(1.2+k*T.laneW)/ROADW;
  x.fillStyle="#f5f5f0"; x.fillRect(lx(0)-3,0,6,h); x.fillRect(lx(3)-3,0,6,h);
  x.fillStyle="#ffd23f"; for (const k of [1,2]) for (let y=0;y<h;y+=128) x.fillRect(lx(k)-3,y,6,64); },[1,SEG/12]);
const grassTex=canvasTex(128,128,(x,w,h)=>{ x.fillStyle="#6cc24a"; x.fillRect(0,0,w,h); for (let i=0;i<400;i++){ x.fillStyle=Math.random()<.5?"#5fb33f":"#79cf57"; x.fillRect(Math.random()*w,Math.random()*h,3,3); } },[10,8]);
const roadMat=new THREE.MeshLambertMaterial({ map:roadTex }), grassMat=new THREE.MeshLambertMaterial({ map:grassTex });
const roadGeo=new THREE.PlaneGeometry(ROADW,SEG), grassGeo=new THREE.PlaneGeometry(160,SEG), curbGeo=new THREE.BoxGeometry(0.5,0.25,SEG);
const trunkM=M(0x8b5a2b), leafMs=[M(0x3f9e3a),M(0x4caf50),M(0x2e8b57)], houseMs=[M(0xfde68a),M(0xfecaca),M(0xbfdbfe),M(0xddd6fe),M(0xfed7aa)], roofM=M(0xb91c1c), roofM2=M(0x475569), poleM=M(0x9ca3af), curbM=M(0xe5e7eb);
const CONE=new THREE.ConeGeometry(1,1,7), SPHERE=new THREE.IcosahedronGeometry(1,0);
// city: sidewalk + window-facade buildings (a few colour variants sharing textures)
const WALK=3.2;
const walkMat=M(0xc9ced6), walkGeo=new THREE.PlaneGeometry(WALK,SEG);
const HEIGHTS=[8,12,16,22,30,40];
const FACADE_COLORS=[["#c8d3e0","#7d8ea6"],["#e8d6b9","#a8865a"],["#d9c3c3","#9b6b6b"],["#b9c9d9","#5f7896"],["#d2d8c4","#7a8a5c"],["#9fb6cc","#3d5a7a"],["#e5e0d8","#8f8577"]];
const FACADES=FACADE_COLORS.map(([base,frame],k)=>{
  const tex=canvasTex(128,256,(x,w,h)=>{ x.fillStyle=base; x.fillRect(0,0,w,h);
    const r=RUSH.rng(k*31+7);
    for (let row=0;row<10;row++) for (let col=0;col<4;col++){
      const lit=r()<0.22; x.fillStyle=lit?"#ffe9a8":(r()<0.5?"#41556e":"#4c6480");
      x.fillRect(8+col*30,10+row*24,22,15); x.fillStyle=frame; x.fillRect(8+col*30,25+row*24,22,3); }
    x.fillStyle=frame; x.fillRect(0,h-26,w,26); });
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  // one material per height so a floor is always ~3 m tall (10 window rows per texture repeat)
  return HEIGHTS.map(h=>{ const t=tex.clone(); t.needsUpdate=true; t.repeat.set(1.2,h/30); return new THREE.MeshLambertMaterial({ map:t }); });
});
const ROOFS=FACADE_COLORS.map(([,frame])=>M(new THREE.Color(frame).multiplyScalar(0.8)));
const segs=new Map();
function buildSeg(k){
  const g=new THREE.Group(), z0=-k*SEG-SEG/2, r=RUSH.rng(k*977+13);
  const road=new THREE.Mesh(roadGeo,roadMat); road.rotation.x=-Math.PI/2; road.position.set(0,0,z0); g.add(road);
  const grass=new THREE.Mesh(grassGeo,grassMat); grass.rotation.x=-Math.PI/2; grass.position.set(0,-0.02,z0); g.add(grass);
  for (const sx of [-1,1]){ const c=new THREE.Mesh(curbGeo,curbM); c.position.set(sx*(ROADW/2+0.25),0.12,z0); g.add(c); }
  for (const sx of [-1,1]){
    // sidewalk
    const walk=new THREE.Mesh(walkGeo,walkMat); walk.rotation.x=-Math.PI/2; walk.position.set(sx*(ROADW/2+0.5+WALK/2),0.05,z0); g.add(walk);
    // a tight row of city buildings right beside the sidewalk: close-up scenery rushing past = sense of speed
    let z=z0+SEG/2;
    while (z>z0-SEG/2){
      const depth=8+r()*12, gap=r()<0.15?6+r()*6:0.6+r()*1.4;       // along the road
      const zc=z-depth/2;
      if (gap>5 && r()<0.7){                                          // little plaza with a street tree
        const tx=sx*(ROADW/2+0.5+WALK+3), tz=zc;
        const t=new THREE.Mesh(CYL,trunkM); t.scale.set(0.25,1.8,0.25); t.position.set(tx,0.9,tz); g.add(t);
        const lf=new THREE.Mesh(SPHERE,leafMs[r()*3|0]); lf.scale.set(2,2,2); lf.position.set(tx,3.2,tz); g.add(lf);
      } else {
        const v=r()*FACADES.length|0, width=9+r()*8, hi=r()*HEIGHTS.length|0, h=HEIGHTS[hi];
        const x=sx*(ROADW/2+0.5+WALK+width/2);
        const b=new THREE.Mesh(BOX,FACADES[v][hi]); b.scale.set(width,h,depth); b.position.set(x,h/2,zc); g.add(b);
        g.add(box(ROOFS[v],width+0.6,0.6,depth+0.6,x,h+0.3,zc));                                       // roof cap
        if (h>20 && r()<0.5) g.add(box(ROOFS[v],width*0.35,2.5,depth*0.35,x,h+1.5,zc));             // rooftop box
      }
      z-=depth+gap;
    }
    const lamp=box(poleM,0.18,5,0.18,sx*(ROADW/2+1.2),2.5,z0); g.add(lamp); g.add(box(poleM,1.4,0.15,0.18,sx*(ROADW/2+0.6),4.95,z0));
    const lamp2=box(poleM,0.18,5,0.18,sx*(ROADW/2+1.2),2.5,z0+SEG/2); g.add(lamp2); g.add(box(poleM,1.4,0.15,0.18,sx*(ROADW/2+0.6),4.95,z0+SEG/2));
  }
  scene.add(g); return g;
}
function updateSegs(d){
  const k0=Math.floor(d/SEG)-1;
  for (const [k,g] of segs) if (k<k0||k>k0+SEGS){ scene.remove(g); segs.delete(k); }
  for (let k=k0;k<=k0+SEGS;k++) if (k>=-1&&!segs.has(k)) segs.set(k,buildSeg(k));
}
// start + finish arches
function arch(z,label){
  const g=new THREE.Group();
  const tex=canvasTex(512,96,(x,w,h)=>{ for (let i=0;i<w/24;i++) for (let j=0;j<2;j++){ x.fillStyle=(i+j)%2?"#111":"#fff"; x.fillRect(i*24,j*16,24,16); x.fillRect(i*24,h-32+j*16,24,16); }
    x.fillStyle="#ff7a1a"; x.fillRect(0,32,w,h-64); x.fillStyle="#fff"; x.font="900 44px Russo One, sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(label,w/2,h/2+2); });
  g.add(box(M(0xff7a1a),0.5,7,0.5,-ROADW/2-0.4,3.5,0)); g.add(box(M(0xff7a1a),0.5,7,0.5,ROADW/2+0.4,3.5,0));
  const b=new THREE.Mesh(new THREE.PlaneGeometry(ROADW+1.6,2.6),new THREE.MeshBasicMaterial({ map:tex })); b.position.set(0,6.4,0); g.add(b);
  const chk=canvasTex(256,32,(x,w,h)=>{ for (let i=0;i<w/16;i++) for (let j=0;j<2;j++){ x.fillStyle=(i+j)%2?"#111":"#fff"; x.fillRect(i*16,j*16,16,16); } });
  const line=new THREE.Mesh(new THREE.PlaneGeometry(ROADW,1.6),new THREE.MeshBasicMaterial({ map:chk })); line.rotation.x=-Math.PI/2; line.position.y=0.03; g.add(line);
  g.position.z=z; scene.add(g); return g;
}
let finishArch=null, startArch=null;
// glowing boost strips
const boostTex=canvasTex(128,128,(x,w,h)=>{ const gr=x.createLinearGradient(0,0,0,h); gr.addColorStop(0,"rgba(56,225,255,.95)"); gr.addColorStop(1,"rgba(14,165,233,.9)");
  x.fillStyle=gr; x.fillRect(0,0,w,h); x.strokeStyle="#fff"; x.lineWidth=12; x.lineCap="round"; x.lineJoin="round";
  for (const y of [30,78]){ x.beginPath(); x.moveTo(28,y+26); x.lineTo(64,y-6); x.lineTo(100,y+26); x.stroke(); } });
const boostMat=new THREE.MeshBasicMaterial({ map:boostTex, transparent:true, opacity:0.95, depthWrite:false, blending:THREE.AdditiveBlending });
const boostGeo=new THREE.PlaneGeometry(T.laneW*0.82,3.2);
const boostPool=[];
function boostMesh(i){ if (!boostPool[i]){ const m=new THREE.Mesh(boostGeo,boostMat); m.rotation.x=-Math.PI/2; m.position.y=0.04; scene.add(m); boostPool[i]=m; } boostPool[i].visible=true; return boostPool[i]; }

// ============================================================
//  RACE STATE
// ============================================================
const G={ mode:"", track:null, car:null, me:null, startAt:0, others:new Map(), snaps:[], finished:new Map(), myMesh:null, ghostMeshes:new Map(),
  bots:[], sentAt:0, input:{ lane:0, brake:false }, acc:0, done:false, resultShown:false, shake:0, lastEv:"" };
let screen="menu";
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); screen=id;
  $("hud").classList.toggle("on",id==="race");
  const t=id==="menu"?"Back to game hub":"Leave race"; $("exitBtn").title=t; $("exitBtn").setAttribute("aria-label",t);
}
const err=t=>$("err").textContent=t||"";
$("nameIn").value=store.get("cg_name")||"";
const myName=()=>{ const n=$("nameIn").value.trim().slice(0,14)||"Player"; store.set("cg_name",n); return n; };
function flashMsg(t){ const m=$("msg"); m.textContent=t; m.classList.remove("show"); void m.offsetWidth; m.classList.add("show"); }
function popMsg(t,color){ const m=$("pop"); m.textContent=t; m.style.color=color; m.style.textShadow=`0 4px 0 rgba(21,32,51,.35)`; m.classList.remove("show"); void m.offsetWidth; m.classList.add("show"); }

function clearWorld(){
  for (const g of G.ghostMeshes.values()) scene.remove(g); G.ghostMeshes.clear();
  if (G.myMesh) scene.remove(G.myMesh); G.myMesh=null;
  if (finishArch) scene.remove(finishArch); finishArch=null;
  for (const p of Object.values(npcPool)) for (const m of p){ m.used=false; m.visible=false; }
  boostPool.forEach(m=>m&&(m.visible=false));
}
// start a race: players = [{pid,name,color}], me = my pid
function beginRace({ seed, dist, players, me, inMs, mode, resume }){
  clearWorld();
  Object.assign(G,{ mode, track:RUSH.makeTrack(seed,dist), car:RUSH.newCar(), me, startAt:performance.now()+inMs, others:new Map(), snaps:[], finished:new Map(),
    bots:[], sentAt:0, acc:0, done:false, resultShown:false, shake:0, players:new Map(players.map(p=>[p.pid,p])) });
  G.input={ lane:0, brake:false };
  if (resume && resume.d>0){ // rejoin mid-race: carry on from where the server last saw us
    const t=Math.max(0,-inMs/1000); G.car.d=resume.d; G.car.t=t; G.car.v=T.vmax*0.8;
  }
  const meP=G.players.get(me);
  G.myMesh=racer(pcol(meP?meP.color:0),false); scene.add(G.myMesh);
  finishArch=arch(-dist,"FINISH");
  if (!startArch) startArch=arch(0,"RUSH HOUR");
  $("done").classList.remove("on"); $("dots").innerHTML="";
  show("race");
  G.countShown=-1;
}

// ============================================================
//  INPUT — ◀ ▶ change lanes, ▼ brake (hold). Touch: buttons or swipes.
// ============================================================
const keyLane={ ArrowLeft:-1, KeyA:-1, ArrowRight:1, KeyD:1 };
addEventListener("keydown",e=>{
  if (e.target.tagName==="INPUT") return;
  if (e.key==="Escape" && screen!=="menu") return exitGame();
  if (screen!=="race") return;
  if (keyLane[e.code]!=null){ e.preventDefault(); if (!e.repeat) G.input.lane+=keyLane[e.code]; }
  if (e.code==="ArrowDown"||e.code==="KeyS"){ e.preventDefault(); G.input.brake=true; }
});
addEventListener("keyup",e=>{ if (e.code==="ArrowDown"||e.code==="KeyS") G.input.brake=false; });
addEventListener("blur",()=>{ G.input.brake=false; });
document.querySelectorAll(".pad button").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); b.classList.add("on"); if (k==="brake") G.input.brake=true; else G.input.lane+=k==="left"?-1:1; });
  const up=()=>{ b.classList.remove("on"); if (k==="brake") G.input.brake=false; };
  b.addEventListener("pointerup",up); b.addEventListener("pointercancel",up); b.addEventListener("pointerleave",up);
});
let sw=null;
$("view").addEventListener("pointerdown",e=>{ sw={ x:e.clientX, y:e.clientY }; });
$("view").addEventListener("pointermove",e=>{ if (!sw||screen!=="race") return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if (Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy)){ G.input.lane+=dx>0?1:-1; sw={ x:e.clientX, y:e.clientY }; }
  else if (dy>36){ G.input.brake=true; } });
addEventListener("pointerup",()=>{ if (sw){ sw=null; if (!document.querySelector(".pad button.on")) G.input.brake=false; } });

// ============================================================
//  LOOP — fixed 60 Hz sim, render every frame
// ============================================================
function raceTime(now){ return (now-G.startAt)/1000; }
function leaderD(){ let L=G.car.d; for (const o of G.others.values()) L=Math.max(L,o.d); for (const b of G.bots) L=Math.max(L,b.car.d); return L; }
function simStep(){
  const lane=Math.sign(G.input.lane); G.input.lane-=lane;
  const ev=RUSH.step(G.car,G.track,DT,DEMO&&G.demoBot?RUSH.botInput(G.demoBot,G.car,G.track,DT):{ lane, brake:G.input.brake },leaderD());
  for (const b of G.bots) if (!b.car.done) RUSH.step(b.car,G.track,DT,RUSH.botInput(b.bot,b.car,G.track,DT),leaderD());
  if (ev==="rear"){ popMsg("BUMP!","#ff5d5d"); G.shake=0.5; $("hitFlash").style.opacity=1; setTimeout(()=>$("hitFlash").style.opacity=0,120); }
  else if (ev==="side"){ popMsg("SCRAPE!","#ffb020"); G.shake=0.25; }
  else if (ev==="boost") popMsg("BOOST!","#38e1ff");
  else if (ev==="pullover") popMsg("MAKE WAY!","#22c55e");
  else if (ev==="finish") onFinish();
}
function onFinish(){
  G.done=true;
  const t=G.car.finishT;
  if (G.mode==="online") Net.send({ t:"finish", time:t });
  $("dTitle").textContent="FINISHED!"; $("dTime").textContent=fmt(t);
  $("dNote").textContent=G.mode==="solo"?"Nice driving!":"Waiting for the others…";
  $("done").classList.add("on"); flashMsg("FINISH!");
  if (G.mode==="solo") setTimeout(soloResults,2500);
}
// interpolated ghost positions (online) or bot cars (solo)
function ghostStates(now){
  if (G.mode==="solo") return G.bots.map(b=>({ pid:b.pid, d:b.car.d, x:b.car.x, fin:b.car.done }));
  const S=G.snaps; if (!S.length) return [];
  const rt=now-150; let a=S[0], b=S[0];
  for (let i=S.length-1;i>=0;i--) if (S[i].t<=rt){ a=S[i]; b=S[i+1]||S[i]; break; }
  const k=b.t>a.t?Math.min(1,(rt-a.t)/(b.t-a.t)):1;
  return b.p.filter(q=>q[0]!==G.me).map(q=>{ const pa=a.p.find(z=>z[0]===q[0])||q; return { pid:q[0], d:pa[1]+(q[1]-pa[1])*k, x:pa[2]+(q[2]-pa[2])*k, fin:!!q[3] }; });
}
function render(now){
  const car=G.car, rt=raceTime(now);
  // vehicles
  for (const p of Object.values(npcPool)) for (const m of p){ m.used=false; }
  for (const o of RUSH.traffic(G.track,car)){ const m=npcMesh(o.type); m.position.set(o.x,0,-(o.z+o.len/2)); m.rotation.y=o.pulled?-Math.sign(o.x)*0.12*Math.max(0,1-Math.abs(Math.abs(o.x)-RUSH.SHOULDER)/2):0; }
  for (const p of Object.values(npcPool)) for (const m of p) if (!m.used) m.visible=false;
  // boost strips near me
  let bi=0; for (const b of G.track.boosts){ if (b.z<car.d-10||b.z>car.d+200) continue; const m=boostMesh(bi++); m.position.set(RUSH.laneX(b.lane),0.04,-b.z); }
  for (let i=bi;i<boostPool.length;i++) if (boostPool[i]) boostPool[i].visible=false;
  boostMat.opacity=0.7+0.3*Math.sin(now/120);
  // me
  const lean=(RUSH.laneX(car.lane)-car.x)*0.06;
  G.myMesh.position.set(car.x,0,-(car.d-T.carLen/2)); G.myMesh.rotation.y=lean; G.myMesh.rotation.z=-lean*0.5;
  // ghosts
  const seen=new Set();
  for (const g of ghostStates(now)){
    seen.add(g.pid);
    let m=G.ghostMeshes.get(g.pid);
    if (!m){ const pl=G.players.get(g.pid); m=racer(pcol(pl?pl.color:g.pid),true); scene.add(m); G.ghostMeshes.set(g.pid,m); }
    m.visible=Math.abs(g.d-car.d)<220; m.position.set(g.x,0,-(g.d-T.carLen/2));
    // ghosts right on top of you fade away so your own car always reads clearly
    const near=Math.hypot((g.d-car.d)/2.2,g.x-car.x), op=0.34*Math.max(0.08,Math.min(1,(near-1.2)/3.5));
    m.traverse(o=>{ if (o.material&&o.material.transparent) o.material.opacity=o.material.userData.base*op/0.34; });
  }
  for (const [pid,m] of G.ghostMeshes) if (!seen.has(pid)) m.visible=false;
  // camera
  updateSegs(car.d);
  G.shake=Math.max(0,G.shake-1/60);
  const sx=(Math.random()-0.5)*G.shake*0.6, sy=(Math.random()-0.5)*G.shake*0.4;
  const boostF=car.boost>0?car.boost/T.boostT:0;
  camera.position.set(car.x*0.6+sx,4.3+sy,-car.d+10.5+boostF*1.4);
  camera.lookAt(car.x*0.4,0.8,-car.d-22);
  const baseF=innerWidth/innerHeight<0.8?78:62;
  camera.fov=baseF+Math.min(12,car.v*0.12)+boostF*8; camera.updateProjectionMatrix();
  $("boostGlow").style.opacity=boostF;
  renderer.render(scene,camera);
  // HUD
  $("speed").firstChild.nodeValue=Math.round(car.v*3.6);
  $("clock").textContent=fmt(Math.max(0,G.done?car.finishT:rt));
  hud(now);
}
let hudAt=0;
function hud(now){
  if (now-hudAt<120) return; hudAt=now;
  const ghosts=ghostStates(now), all=[{ pid:G.me, d:G.car.d, fin:G.done, ft:G.car.finishT }, ...ghosts.map(g=>({ ...g, ft:G.finished.get(g.pid) }))];
  all.sort((a,b)=>(b.fin-a.fin)||(a.fin&&b.fin?(a.ft??0)-(b.ft??0):b.d-a.d));
  const place=all.findIndex(a=>a.pid===G.me)+1;
  $("place").innerHTML=`${place}<sup style="font-size:.45em">${["th","st","nd","rd"][(place%100>10&&place%100<14)?0:Math.min(place%10,4)%4]||"th"}</sup><small>/ ${all.length}</small>`;
  const D=G.track.dist;
  $("dots").innerHTML=all.map(a=>{ const pl=G.players.get(a.pid); return `<i class="dot ${a.pid===G.me?"me":""}" style="left:calc((100% - 22px) * ${Math.min(1,a.d/D).toFixed(4)});background:${pcol(pl?pl.color:a.pid)}"></i>`; }).join("");
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (screen==="race" && G.car){
    const rt=raceTime(now);
    if (rt<0){ const c=Math.ceil(-rt); if (c!==G.countShown){ G.countShown=c; flashMsg(c); } }
    else {
      if (G.countShown>0){ G.countShown=0; flashMsg("GO!"); }
      G.acc+=dt; let n=0;
      while (G.acc>=DT && n<8){ G.acc-=DT; n++; if (!G.done) simStep(); else for (const b of G.bots) if (!b.car.done) RUSH.step(b.car,G.track,DT,RUSH.botInput(b.bot,b.car,G.track,DT),leaderD()); }
      if (G.done) G.car.v=Math.max(0,G.car.v-20*dt), G.car.d+=0;   // coast to a stop past the line
      if (G.mode==="online" && now-G.sentAt>100 && !G.done){ G.sentAt=now; Net.send({ t:"pos", d:Math.round(G.car.d*10)/10, x:Math.round(G.car.x*100)/100 }); }
    }
    render(now);
  } else if (screen!=="race"){
    // idle backdrop: a slow drive-by behind the menus
    const t=now/1000; updateSegs(t*14%3000); camera.position.set(Math.sin(t*0.2)*3,4.2,-(t*14%3000)+9); camera.lookAt(0,1,-(t*14%3000)-20); camera.fov=62; camera.updateProjectionMatrix(); renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
//  SOLO — race 7 ghost bots locally
// ============================================================
$("bSolo").onclick=()=>{
  const name=myName(); Net.close();
  const seed=(Math.random()*2**31)|0;
  const names=["Zip","Turbo","Nova","Rocket","Pixel","Bolt","Comet"];
  const players=[{ pid:1, name, color:0 }, ...names.map((n,i)=>({ pid:i+2, name:n, color:i+1 }))];
  beginRace({ seed, dist:T.dist, players, me:1, inMs:3000, mode:"solo" });
  G.bots=names.map((n,i)=>({ pid:i+2, bot:RUSH.makeBot(seed+i*101,0.25+0.6*i/(names.length-1)), car:RUSH.newCar() }));
  G.demoBot=DEMO?RUSH.makeBot(seed+7,0.7):null;
};
function soloResults(){
  if (G.resultShown || screen!=="race") return;
  // bots still on the road finish instantly (they're ghosts)
  let guard=0; while (G.bots.some(b=>!b.car.done) && guard++<60*400) for (const b of G.bots) if (!b.car.done) RUSH.step(b.car,G.track,DT,RUSH.botInput(b.bot,b.car,G.track,DT),leaderD());
  const rank=[{ pid:G.me, name:G.players.get(G.me).name, color:0, time:G.car.finishT }, ...G.bots.map(b=>({ pid:b.pid, name:G.players.get(b.pid).name, color:G.players.get(b.pid).color, time:b.car.finishT }))].sort((a,b)=>a.time-b.time);
  showResults(rank);
}

// ============================================================
//  RESULTS — top 3 or top 15 % (whichever is more) + your place
// ============================================================
const topCount=n=>Math.min(n,Math.max(3,Math.ceil(n*0.15)));
function showResults(rank){
  G.resultShown=true;
  const w=rank[0], n=topCount(rank.length), best=w.time;
  $("champ").innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v14c0 9-6 16-14 16S18 31 18 22z" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/><path d="M18 12H9c0 9 4 14 11 15M46 12h9c0 9-4 14-11 15" fill="none" stroke="#ffb020" stroke-width="3.5" stroke-linecap="round"/><rect x="28" y="37" width="8" height="9" fill="#e0a800"/><rect x="20" y="46" width="24" height="7" rx="2" fill="#ff7a1a"/><rect x="16" y="53" width="32" height="5" rx="2" fill="#152033"/></svg>
    <div class="t">${w.pid===G.me?"You won the race!":"Race champion!"}</div><h2>${esc(w.name)}</h2>`;
  const line=(e,i)=>`<div class="line ${i===0?"p1":""} ${e.pid===G.me?"me":""}" style="animation-delay:${i*60}ms"><span class="pos">${i+1}</span><i style="background:${pcol(e.color)}"></i>
    <span class="nm">${esc(e.name)}${e.pid===G.me?" (you)":""}</span><span class="tm">${e.time!=null?fmt(e.time):Math.round(100*(e.d||0)/G.track.dist)+"%"}</span><span class="gap">${i&&e.time!=null?"+"+(e.time-best).toFixed(1)+"s":""}</span></div>`;
  $("rBoard").innerHTML=rank.slice(0,n).map(line).join("");
  const mi=rank.findIndex(e=>e.pid===G.me);
  $("rYou").innerHTML=mi>=n?`<span>You · ${mi+1} of ${rank.length}</span><span>${rank[mi].time!=null?fmt(rank[mi].time)+" (+"+(rank[mi].time-best).toFixed(1)+"s)":"didn't finish"}</span>`:"";
  $("bAgain").textContent=G.mode==="solo"?"Race again":"Back to lobby";
  show("results"); confetti();
}
$("bAgain").onclick=()=>{ if (G.mode==="solo") $("bSolo").click(); else { show("lobby"); renderLobby(); } };
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:140},(_,i)=>({ x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5, v:2+Math.random()*4, s:5+Math.random()*7, r:Math.random()*6, c:i%3?pcol(i):"#ffd23f" }));
  const t0=performance.now();
  (function f(now){ const age=(now-t0)/1000; x.clearRect(0,0,c.width,c.height);
    for (const p of P){ p.y+=p.v; p.r+=0.08; x.save(); x.globalAlpha=Math.max(0,1-Math.max(0,age-2.8)/1.4); x.translate(p.x+Math.sin(p.r)*14,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); x.restore(); }
    if (age<4.2) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}

// ============================================================
//  NETWORK
// ============================================================
const Net={
  ws:null, want:false, retry:0, queue:[], pid:0, code:null, lobby:null, token:store.get("cg_token"),
  url(){ const s=(window.CG_CONFIG&&CG_CONFIG.server)||""; if (s) return s; if (!location.host) return null; return (location.protocol==="https:"?"wss://":"ws://")+location.host; },
  open(){
    this.want=true; if (this.ws&&this.ws.readyState<=1) return;
    const url=this.url(); if (!url) return err("Online play needs the game server.");
    const ws=this.ws=new WebSocket(url);
    ws.onopen=()=>{ this.retry=0; ws.send(JSON.stringify({ t:"hello", name:myName(), token:this.token, auth:window.ClassKit?ClassKit.auth():undefined })); for (const m of this.queue.splice(0)) ws.send(JSON.stringify(m)); };
    ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch{ return; } onNet(m); };
    ws.onclose=()=>{ if (!this.want) return; if (screen==="menu") err("Can't reach the game server. Retrying…"); setTimeout(()=>this.want&&this.open(),Math.min(5000,500*2**this.retry++)); };
  },
  send(m){ if (this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(m)); else if (this.want){ this.queue.push(m); this.open(); } },
  close(){ this.want=false; if (this.ws) this.ws.close(); this.ws=null; },
};
function onNet(m){
  if (window.ClassKit&&ClassKit.onNet(m)) return;
  if (teacherIntercept(m)) return;
  switch (m.t){
    case "welcome": Net.token=m.token; store.set("cg_token",m.token); break;
    case "joined":
      if (m.game!=="rush"){ Net.send({ t:"leave" }); Net.close(); show("menu"); return err("That code is for a different game."); }
      Net.pid=m.pid; Net.code=m.code; if (screen==="menu") show("lobby"); break;
    case "lobby": Net.lobby=m; m.at=performance.now(); if (screen==="lobby") renderLobby(); break;
    case "go": beginRace({ seed:m.seed, dist:m.dist, players:m.players, me:Net.pid, inMs:m.in, mode:"online", resume:m.you }); break;
    case "ps": if (G.mode==="online"){ G.snaps.push({ t:performance.now(), p:m.p }); if (G.snaps.length>20) G.snaps.shift(); for (const q of m.p) if (q[0]!==G.me) G.others.set(q[0],{ d:q[1] }); } break;
    case "fin": if (m.pid!==Net.pid) G.finished.set(m.pid,m.time); break;
    case "results": if (G.mode==="online") showResults(m.rank); break;
    case "error": Net.code=null; show("menu"); err(m.msg||"Something went wrong."); break;
  }
}
let lobbyTimer=0;
function renderLobby(){
  const L=Net.lobby; if (!L) return;
  $("lKind").textContent=L.pub?"Online race":"Private race";
  $("lCode").textContent=L.code;
  $("lCount").textContent=`${L.players.length} / ${L.max} racers`;
  $("lGrid").innerHTML=L.players.filter(p=>p.pid!==L.teacher).map(p=>`<span class="chip ${p.pid===Net.pid?"me":""} ${p.connected?"":"away"}"><i style="background:${pcol(p.color)}"></i>${esc(p.name)}${p.pid===L.host?" ★":""}</span>`).join("");
  const host=L.host===Net.pid;
  $("bStart").style.display=host?"":"none";
  clearInterval(lobbyTimer);
  const note=()=>{
    let t=L.state==="playing"?"A race is going on…":host?"You're the host. Start when everyone's in!":"Waiting for the host to start…";
    if (L.autoIn&&L.state==="lobby"){ const s=Math.max(0,Math.ceil((L.autoIn-(performance.now()-L.at))/1000)); t=`Starting by itself in ${s}s`+(host?". Or start now!":""); }
    $("lNote").textContent=(L.pub?"":"Share the code with friends. ")+t;
  };
  const note2=()=>{ note(); teacherLobby(L); }; note2(); lobbyTimer=setInterval(note2,500);
}
function goOnline(msg){ err(""); myName(); Net.open(); Net.send(msg); }
$("bPublic").onclick=()=>goOnline({ t:"quick", game:"rush" });
$("bPrivate").onclick=()=>goOnline({ t:"create", game:"rush" });
$("bJoin").onclick=()=>{ const c=$("codeIn").value.trim().toUpperCase(); if (c.length!==4) return err("Race codes are 4 letters."); goOnline({ t:"join", code:c }); };
$("codeIn").addEventListener("keydown",e=>{ if (e.key==="Enter") $("bJoin").click(); });
$("bStart").onclick=()=>Net.send({ t:"start" });
$("bLeave").onclick=()=>{ Net.send({ t:"leave" }); Net.close(); Net.code=null; show("menu"); };

// ============================================================
//  TEACHER MODE — the teacher runs a private room without playing
// ============================================================
function teacherLobby(L){
  if (!L || !L.teacher) return;
  const iTeach=L.teacher===Net.pid, kids=L.players.filter(p=>p.pid!==L.teacher), t=L.players.find(p=>p.pid===L.teacher);
  const cnt=$("lCount"); if (cnt) cnt.textContent=`${kids.length} / ${L.max-1} students`;
  $("lKind").textContent="🍎 Teacher mode · private game";
  $("bStart").textContent="Start for the class"; $("bStart").style.display=iTeach?"":"none";
  $("lNote").textContent=iTeach?"Share this code with your class. You won't play: press Start when everyone's in.":`🍎 ${t?t.name:"Your teacher"} will start the game.`;
}
function teacherIntercept(m){
  if (m.t==="joined" && Net.wantTeacher && m.game==="rush"){ Net.wantTeacher=false; Net.send(window.ClassKit?ClassKit.teacherMsg():{ t:"teacher" }); }
  return teacherView(m);
}
$("bTeacher").onclick=()=>(window.ClassKit?ClassKit.beginTeacher:(go=>go()))(()=>{ Net.wantTeacher=true; goOnline({ t:"create", game:"rush" }); });

const CV={ on:false, players:new Map(), dist:100, fin:new Map(), el:null };
function classView(m){
  CV.on=true; CV.players=new Map(m.players.map(p=>[p.pid,p])); CV.dist=m.dist; CV.fin=new Map();
  G.mode="online"; G.me=Net.pid; G.players=CV.players; if (typeof G.track!=="undefined") G.track={ dist:CV.dist };
  if (!CV.el){ CV.el=document.createElement("div"); CV.el.id="classView";
    CV.el.style.cssText="position:fixed;inset:0;z-index:6;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;background:rgba(15,20,30,.82);backdrop-filter:blur(4px)";
    document.body.appendChild(CV.el); }
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on")); screen="class";
  CV.el.style.display="flex"; CV.start=performance.now()+m.in; renderCV([]);
}
function renderCV(rows){
  if (!CV.on) return;
  const all=[...CV.players.values()].map(p=>{ const q=rows.find(r=>r[0]===p.pid); return { p, d:q?q[1]:0, done:q?!!q[3]:false, t:CV.fin.get(p.pid) }; })
    .sort((a,b)=>(b.done-a.done)||(a.done&&b.done?a.t-b.t:b.d-a.d));
  const secs=Math.max(0,(performance.now()-CV.start)/1000), pre=performance.now()<CV.start;
  const shown=Math.min(all.length,Math.max(3,Math.ceil(all.length*0.15))), rest=all.length-shown, restDone=all.slice(shown).filter(a=>a.done).length;
  CV.el.innerHTML=`<div style="width:min(900px,100%);background:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 30px 70px -20px #000;font-family:inherit;color:#1b2a3a">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <div><div style="font-weight:900;letter-spacing:2px;font-size:13px;color:#ea580c">🍎 CLASS VIEW · LIVE STANDINGS</div><div style="font-size:30px;font-weight:900">${pre?"Get ready…":all.every(a=>a.done)?"Everyone finished!":"Race in progress"}</div></div>
      <div style="font-size:34px;font-weight:900;font-variant-numeric:tabular-nums">${pre?Math.ceil((CV.start-performance.now())/1000):fmt(secs)}</div></div>
    <div style="font-weight:900;letter-spacing:1px;font-size:12px;color:#5a6b7e;margin:-4px 0 8px">TOP ${shown} OF ${all.length}</div>
    <div style="display:flex;flex-direction:column;gap:6px">${all.slice(0,shown).map((a,i)=>`<div style="display:grid;grid-template-columns:34px minmax(90px,180px) 1fr 78px;gap:10px;align-items:center;font-weight:800">
      <span style="font-size:18px;color:#5a6b7e">${i+1}</span><span style="display:flex;align-items:center;gap:8px;min-width:0"><i style="width:14px;height:14px;border-radius:4px;flex:none;background:${pcol(a.p.color)}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.p.name)}</span></span>
      <span style="height:14px;border-radius:8px;background:#e8eef5;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,100*a.d/CV.dist)}%;background:${a.done?"#16a34a":pcol(a.p.color)};border-radius:8px"></i></span>
      <span style="text-align:right;font-variant-numeric:tabular-nums">${a.done&&a.t!=null?fmt(a.t):Math.round(100*a.d/CV.dist)+"%"}</span></div>`).join("")}</div>
    ${rest?`<div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:#f1f6fb;font-weight:800;color:#5a6b7e;text-align:center">+ ${rest} more student${rest===1?"":"s"} ${restDone===rest?"finished":"still racing"}. Keep going! 💪</div>`:""}</div>`;
}
function endCV(){ CV.on=false; if (CV.el) CV.el.style.display="none"; }
function teacherView(m){
  if (m.t==="go" && m.teacher && m.teacher===Net.pid){ classView(m); return true; }
  if (CV.on && m.t==="ps"){ CV.rows=m.p; renderCV(m.p); return true; }
  if (CV.on && m.t==="fin"){ CV.fin.set(m.pid,m.time); renderCV(CV.rows||[]); return true; }
  if (CV.on && m.t==="results"){ endCV(); showResults(m.rank); return true; }
  if (m.t==="lobby" && CV.on){ Net.lobby=m; m.at=performance.now(); return true; }
  return false;
}
function exitGame(){
  if (screen==="menu"){ location.href="../"; return; }
  if (Net.ws && Net.ws.readyState===1) Net.ws.send(JSON.stringify({ t:"leave" }));
  Net.close(); Net.code=null; Net.lobby=null; clearInterval(lobbyTimer);
  G.car=null; G.mode=""; clearWorld();
  show("menu");
}
$("exitBtn").onclick=exitGame;
addEventListener("DOMContentLoaded",()=>{ const q=new URLSearchParams(location.search).get("play"); if (!q) return; history.replaceState(null,"",location.pathname);
  if (q==="public") $("bPublic").click(); else if (q==="private") $("bPrivate").click(); else if (q==="teacher") $("bTeacher").click(); else if (q==="solo") $("bSolo").click(); });
// hub "Have a code?" deep link: ?join=CODE
addEventListener("DOMContentLoaded",()=>{ const j=new URLSearchParams(location.search).get("join"); if (!j) return; history.replaceState(null,"",location.pathname);
  $("codeIn").value=j.toUpperCase(); $("bJoin").click(); });

if (DEMO) addEventListener("DOMContentLoaded",()=>{ $("bSolo").click(); let rs=0; setInterval(()=>{ if (screen==="results"){ if (++rs>5){ rs=0; $("bSolo").click(); } } else rs=0; },1000); });
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Site Analytics · Joshua Game Hub</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main>
  <div class="top">
    <div><h1>Site analytics</h1><p class="sub">Daily totals counted on our own server. No cookies, no outside trackers, nothing about any one person.</p></div>
    <select id="days" aria-label="Time range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select>
  </div>
  <div id="out"><div class="msg">Loading…</div></div>
  <p class="note">Days are UTC. Numbers update about once a minute. "Peak online" is the most connections at once.</p>
</main>
<script src="../config.js" onerror="window.CG_CONFIG={server:''}"></script>
<script src="/admin/admin.js"></script>
<script>
const GAMES={ cg:"Clean Getaway", math:"Math Race", arrows:"Arrow Blitz", rush:"Rush Hour", hurdle:"Hurdle Dash", hoops:"Mathsketball", munch:"Marble Munch", bear:"Bear Attack!", memory:"Memory Tiles", typing:"Typing Cowboys", cannons:"Star Cannons", darts:"Dart Party", sky:"Sky Climb", words:"Word Rush" };
const PAGES={ "/":"Hub (home page)", "/teacher/":"Teacher dashboard", "/admin/":"Admin", "/school/":"School castles" };
async function load(){
  if (!token()) return gate();
  try{ render(await api("/api/admin/stats?days="+$("days").value)); }catch(e){ gate(e); }
}
function render(d){
  const sum={}, byDay={}, peak={};
  for (const r of d.rows){
    sum[r.metric]=(sum[r.metric]||0)+r.n;
    if (r.metric==="peak") peak[r.day]=r.n;
    if (r.metric.startsWith("view:")) byDay[r.day]=(byDay[r.day]||0)+r.n;
  }
  const tot=p=>Object.entries(sum).filter(([k])=>k.startsWith(p)).reduce((a,[,v])=>a+v,0);
  // every day in range, oldest first
  const dayList=[]; for (let i=d.days-1;i>=0;i--){ const t=new Date(Date.now()-i*864e5); dayList.push(t.toISOString().slice(0,10)); }
  const max=Math.max(1,...dayList.map(x=>byDay[x]||0));
  const games=Object.keys(GAMES).map(k=>({ k, rooms:(sum[`room:${k}:public`]||0)+(sum[`room:${k}:private`]||0), teach:sum["teach:"+k]||0, play:sum["play:"+k]||0, join:sum["join:"+k]||0 }))
    .sort((a,b)=>b.join-a.join||b.play-a.play);
  const pages=Object.entries(sum).filter(([k])=>k.startsWith("view:")).map(([k,v])=>{ const [p,q]=k.slice(5).split("?"); return { p, q, v }; }).sort((a,b)=>b.v-a.v);
  const label=p=>{ if (PAGES[p]) return PAGES[p]; const slug=p.replace(/\//g,""); return slug.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" "); };
  const T=d.totals||{};
  $("out").innerHTML=`
  <div class="tiles">
    <div class="tile"><b>${n(tot("view:"))}</b><span>Page views</span></div>
    <div class="tile"><b>${n(tot("play:"))}</b><span>Games started</span></div>
    <div class="tile"><b>${n(tot("join:"))}</b><span>Players joined a room</span></div>
    <div class="tile"><b>${n(tot("teach:"))}</b><span>Teacher Mode games</span></div>
    <div class="tile"><b>${n(Math.max(0,...Object.values(peak)))}</b><span>Peak online</span></div>
  </div>
  <h2>Page views per day</h2>
  <div class="card"><div class="chart">${dayList.map(x=>`<div style="height:${(byDay[x]||0)/max*100}%" title="${x}: ${n(byDay[x])} views"></div>`).join("")}</div>
    <div class="axis"><span>${dayList[0]}</span><span>busiest day: ${n(max===1&&!Object.keys(byDay).length?0:max)}</span><span>${dayList[dayList.length-1]}</span></div></div>
  <h2>Who's playing? (hub button presses)</h2>
  <div class="tiles">
    <div class="tile"><b>${n(sum["mode:student"])}</b><span>Student</span></div>
    <div class="tile"><b>${n(sum["mode:teacher"])}</b><span>Teacher</span></div>
    <div class="tile"><b>${n(sum["mode:guest"])}</b><span>Guest</span></div>
  </div>
  <h2>Games</h2>
  <div class="card"><table><tr><th>Game</th><th>Rooms opened</th><th>Teacher Mode</th><th>Games started</th><th>Players joined</th></tr>
    ${games.map(g=>`<tr><td>${esc(GAMES[g.k])}</td><td>${n(g.rooms)}</td><td>${n(g.teach)}</td><td>${n(g.play)}</td><td>${n(g.join)}</td></tr>`).join("")}</table></div>
  <h2>Pages</h2>
  <div class="card"><table><tr><th>Page</th><th>Opened as</th><th>Views</th></tr>
    ${pages.length?pages.map(x=>`<tr><td>${esc(label(x.p))}</td><td>${esc(x.q||"—")}</td><td>${n(x.v)}</td></tr>`).join(""):`<tr><td colspan="3">No views yet.</td></tr>`}</table></div>
  <h2>Teacher accounts (all time)</h2>
  <div class="tiles">
    <div class="tile"><b>${n(T.teachers)}</b><span>Teachers (${n(T.new_teachers)} new in range)</span></div>
    <div class="tile"><b>${n(T.classes)}</b><span>Classes</span></div>
    <div class="tile"><b>${n(T.students)}</b><span>Students in classes</span></div>
    <div class="tile"><b>${n(T.saved_games)}</b><span>Saved class games</span></div>
    <div class="tile"><b>${n(T.bricks)}</b><span>🧱 Castle bricks built</span></div>
    <div class="tile"><b>${n(T.live_tournaments)}</b><span>⚔️ Tournaments running</span></div>
  </div>`;
}
$("days").addEventListener("change",load);
load();
</script>
</body>
</html>
